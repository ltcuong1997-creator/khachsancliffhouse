# Mỗi lần có code mới vào nhánh main thì tự deploy lên Firebase Hosting.
# Cần secret FIREBASE_SERVICE_ACCOUNT (nội dung file JSON service account) trong
# Settings → Secrets and variables → Actions của repo. Xem SETUP.md.
# Chỉ deploy hosting; firestore.rules vẫn deploy tay khi có sửa.
name: Deploy lên Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: khachsancliffhouse
          channelId: live
