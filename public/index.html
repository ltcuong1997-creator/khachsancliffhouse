<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F4">
<meta name="apple-mobile-web-app-title" content="Cliff House">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cliff House — Quản trị khách sạn</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   NỀN NGÀ, THẺ NỔI, KHÔNG VIỀN NGĂN
   ---------------------------------------------------------------------
   Dựng theo đúng nguyên tắc của ZSpace: NỀN NGÀ chạy liền mạch cho cả trang, cột menu, thanh trên
   và mọi khe hở giữa các thẻ — chỉ THẺ NỘI DUNG mới trắng tinh. Mắt tự tách được "vùng ngà =
   điều hướng / vùng trắng = làm việc" mà không cần một đường kẻ nào, nên bỏ được toàn bộ viền.
   Chiều sâu đến từ BÓNG NHIỀU TẦNG chứ không phải nghiêng/xoay: một tầng sát viền cho nét, hai
   tầng rộng rất nhạt cho độ nổi. Bảng số liệu vẫn phẳng để còn gõ được.
   Màu thương hiệu là vàng đồng của khách sạn, không lấy xanh ngọc của ZSpace.
   ===================================================================== */
:root{
  --ink:#14181C;
  --ink-2:#1F252B;
  --canvas:#F7F5F4;          /* ngà ấm — nền của TẤT CẢ trừ thẻ */
  --card:#FFFFFF;
  --line:#E8E5E3;
  --line-soft:#F1EFED;
  --txt:#14181C;
  --txt-2:#5A6068;
  --txt-3:#8B9199;
  --brand:#B07D2B;
  --brand-dark:#8C6220;
  --brand-bright:#D9A23F;
  --brand-wash:#FAF3E4;
  --green:#12875A;
  --green-wash:#E6F4EE;
  --red:#C4443C;
  --red-wash:#FBECEB;
  --blue:#2F6DB5;
  --blue-wash:#EAF1FA;
  --violet:#6C5CE7;
  --violet-wash:#EFEDFE;
  --amber:#D98A0B;
  --amber-wash:#FDF3E0;
  --r:12px; --r-l:18px; --r-xl:24px;
  /* Ba tầng bóng: sát viền cho nét, rộng vừa cho khối, rộng rất nhạt cho độ cao */
  --sh-1:0 1px 2px rgba(20,24,28,.05), 0 4px 10px rgba(20,24,28,.05);
  --sh-card:0 1px 2px rgba(20,24,28,.05), 0 5px 14px rgba(20,24,28,.055), 0 16px 40px rgba(20,24,28,.05);
  --sh-up:0 2px 4px rgba(20,24,28,.05), 0 8px 18px rgba(20,24,28,.07), 0 26px 52px rgba(20,24,28,.08);
  --sh-brand:0 4px 12px rgba(176,125,43,.26);
  --sans:'K2D', system-ui, -apple-system, sans-serif;
  --nav-w:240px;
  --top-h:64px;
  /* Nhịp chung của mọi chuyển động chậm — cùng một đường cong thì cả app đi cùng một nhịp thở */
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--canvas);color:var(--txt);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
svg{flex-shrink:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#DAD6D3;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--txt-3)}
.hint{font-size:12px;color:var(--txt-3);line-height:1.5}

/* ================= KHUNG ================= */
.shell{display:flex;min-height:100vh;min-height:100dvh}
/* Đổi đúng một biến --nav-w là cả cột menu lẫn lề trái vùng làm việc đi theo */
.shell.nav-min{--nav-w:76px}
.nav{width:var(--nav-w);flex:0 0 var(--nav-w);background:var(--canvas);color:var(--txt);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;padding:4px 12px 0}
.nav-brand{padding:16px 6px 14px;display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:12px;flex:0 0 38px;overflow:hidden;
  background:linear-gradient(150deg,var(--brand-bright),var(--brand-dark));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
  letter-spacing:-.02em;box-shadow:var(--sh-brand)}
/* Dùng nguyên ảnh toà nhà, không cắt xén. Ảnh gốc vuông 428x428 nên vừa khít ô vuông,
   object-fit:cover chỉ để phòng trường hợp sau này thay bằng ảnh không vuông. */
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.nav-nm{min-width:0}
.nav-brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.15;color:var(--txt)}
.nav-brand small{font-size:10px;color:var(--txt-3);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.nav-min-btn{margin-left:auto;width:30px;height:30px;border-radius:9px;color:var(--txt-3);
  display:flex;align-items:center;justify-content:center;flex:0 0 30px;transition:background .16s,color .16s}
.nav-min-btn:hover{background:rgba(20,24,28,.06);color:var(--txt)}
/* Bỏ hẳn thanh cuộn xám của cột menu — vẫn cuộn được bằng con lăn / vuốt */
.nav-scroll{flex:1;overflow-y:auto;padding:0 0 14px;position:relative;scrollbar-width:none;-ms-overflow-style:none}
.nav-scroll::-webkit-scrollbar{display:none;width:0;height:0}
.nav-group{margin:15px 0 5px;padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.02em;
  color:var(--txt-3);white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 11px;border-radius:10px;
  color:var(--txt-2);font-weight:500;font-size:14px;margin-bottom:2px;text-align:left;
  position:relative;z-index:1;transition:color .2s,background-color .2s}
.nav-item:hover{background:rgba(20,24,28,.05);color:var(--txt)}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;color:var(--txt-3);transition:color .2s}
/* Mục đang mở KHÔNG tự tô nền — viên pill .nav-hl trượt tới nằm dưới nó mới là cái tô màu */
.nav-item.on{background:transparent;color:#fff;font-weight:600}
.nav-item.on .ic{color:#fff}
.nav-lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Viên highlight trượt: JS đo vị trí mục đang mở (useHlRect), CSS chỉ lo trượt top/height */
.nav-hl{position:absolute;left:0;right:0;border-radius:10px;background:var(--brand);
  box-shadow:var(--sh-brand);z-index:0;pointer-events:none;
  transition:top .5s var(--ease),height .5s var(--ease)}
.nav-foot{border-top:1px solid var(--line);padding:12px 2px 16px;margin-top:auto}
.nav-user{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;
  background:var(--card);box-shadow:var(--sh-1)}
.nav-user b{font-size:13px;display:block;line-height:1.25;color:var(--txt)}
.nav-user small{font-size:11px;color:var(--txt-3);display:block}
.av{width:30px;height:30px;border-radius:99px;flex:0 0 30px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.nav-out{margin-top:8px;width:100%;padding:8px;border-radius:10px;background:var(--card);
  color:var(--txt-2);font-size:13px;font-weight:600;box-shadow:var(--sh-1);transition:color .16s,box-shadow .2s}
.nav-out:hover{color:var(--red);box-shadow:var(--sh-up)}

/* ---- MENU THU GỌN: chỉ còn dải icon ---- */
.nav-min .nav-brand{flex-direction:column;gap:10px;padding:16px 0 12px}
.nav-min .nav-nm{display:none}
.nav-min .nav-min-btn{margin-left:0}
.nav-min .nav-item{justify-content:center;padding:10px 0;gap:0}
.nav-min .nav-lb{display:none}
.nav-min .nav-hl{right:auto;width:52px}
/* Nhãn nhóm thu lại thành một vạch mảnh — vẫn thấy ranh giới nhóm mà không tốn dòng chữ */
.nav-min .nav-group{height:1px;padding:0;margin:10px 14px;background:var(--line);color:transparent;overflow:hidden;font-size:0}
.nav-min .nav-foot{padding:12px 0 16px}
.nav-min .nav-user{justify-content:center;padding:6px}
.nav-min .nav-user .who{display:none}
.nav-min .nav-out{font-size:0;padding:9px 0}
.nav-min .nav-out::before{content:'⏻';font-size:14px}
/* ---- Rê chuột vào một icon thì ĐÚNG mục đó dãn ngang ra hiện tên ----
   Khó ở chỗ .nav-scroll phải overflow-y:auto (menu dài hơn màn hình), mà overflow-y khác visible là
   trình duyệt ép luôn overflow-x -> nhãn dãn ra ngoài 76px bị cắt mất. Cách gỡ của ZSpace: cho vùng
   cuộn RỘNG hẳn ra đè lên nội dung trang nhưng trong suốt và pointer-events:none — chỉ riêng từng
   mục menu nhận chuột. Chỗ trống bên phải vẫn bấm xuyên xuống trang như thường, con lăn trên icon
   vẫn cuộn menu vì sự kiện cuộn đi theo cây phần tử chứ không theo vùng bắt chuột. */
@media(hover:hover) and (min-width:961px){
  .nav-min .nav-scroll{width:340px;overflow-x:hidden;pointer-events:none;padding-right:20px}
  /* Vùng cuộn phải rộng 340px thì nhãn mới dãn ra ngoài được, nhưng vạch ngăn nhóm là khối
     block nên nó ăn theo luôn 340px và kẻ một đường dài tràn ra giữa trang. Chốt cứng bề ngang
     đúng bằng dải icon: 52px pill trừ 2×14px lề = 24px, nằm gọn chính giữa cột. */
  .nav-min .nav-group{width:24px}
  .nav-min .nav-item{pointer-events:auto;width:fit-content;min-width:52px;max-width:52px;
    justify-content:flex-start;padding:10px 16px 10px 17px;gap:12px;overflow:hidden;white-space:nowrap;
    transition:max-width .42s var(--ease),background-color .2s,box-shadow .3s,color .2s}
  .nav-min .nav-lb{display:inline;opacity:0;transform:translateX(-8px);
    transition:opacity .18s ease,transform .38s var(--ease)}
  .nav-min .nav-item:hover{max-width:280px;z-index:3;background:var(--card);color:var(--txt);box-shadow:var(--sh-up)}
  .nav-min .nav-item.on:hover{background:var(--brand);color:#fff;box-shadow:var(--sh-brand)}
  .nav-min .nav-item:hover .nav-lb{opacity:1;transform:none;transition-delay:.06s}
}

.main{flex:1;margin-left:var(--nav-w);min-width:0;display:flex;flex-direction:column}
/* Thanh trên cùng nền ngà, không viền dưới — chỉ hơi mờ khi nội dung trượt qua bên dưới */
.topbar{height:var(--top-h);background:rgba(247,245,244,.78);backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);display:flex;align-items:center;gap:14px;
  padding:0 22px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.25}
.topbar .sub{font-size:12px;color:var(--txt-3);font-weight:500;line-height:1.3}
.top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.top-date{font-size:13px;font-weight:600;color:var(--txt-3);background:var(--card);border-radius:99px;
  padding:7px 13px;box-shadow:var(--sh-1);white-space:nowrap;transition:box-shadow .2s}
.top-date:hover{box-shadow:var(--sh-up)}
/* Vùng làm việc dùng trọn bề ngang: thu gọn menu là bảng tự rộng thêm đúng 164px */
.page{padding:20px 22px 40px;max-width:none;width:100%}

/* ================= MẢNH GHÉP ================= */
/* Thẻ: bỏ viền, nổi bằng bóng, bo tròn hơn */
.card{background:var(--card);border:none;border-radius:var(--r-l);box-shadow:var(--sh-card);
  margin-bottom:16px;overflow:hidden;transition:box-shadow .3s cubic-bezier(.22,1,.36,1)}
.card:hover{box-shadow:var(--sh-up)}
/* Thẻ lồng trong thẻ phải CHÌM xuống, không được nổi chồng lên nhau */
.card .card{box-shadow:none;background:var(--canvas);border-radius:14px}
.card .card:hover{box-shadow:none}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-h p{margin:1px 0 0;font-size:12px;color:var(--txt-3)}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:18px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  background:var(--card);border:1px solid transparent;font-size:13px;font-weight:600;
  box-shadow:var(--sh-1);transition:box-shadow .22s,background .16s,color .16s;white-space:nowrap}
.btn:hover{background:#fff;box-shadow:var(--sh-up)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:var(--sh-brand)}
.btn.pri:hover{background:var(--brand-dark);box-shadow:0 8px 22px rgba(176,125,43,.3)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(20,24,28,.2)}
.btn.dark:hover{background:var(--ink-2);box-shadow:0 8px 22px rgba(20,24,28,.26)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-wash)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:var(--sh-1)}

.inp{width:100%;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(176,125,43,.13)}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
select.inp{cursor:pointer}
select.inp:hover{border-color:#D8D3D0}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--txt-2);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-gray{background:#EFEDEB;color:var(--txt-2)}
.t-green{background:var(--green-wash);color:var(--green)}
.t-red{background:var(--red-wash);color:var(--red)}
.t-amber{background:var(--amber-wash);color:#8A6008}
.t-blue{background:var(--blue-wash);color:var(--blue)}
.t-brand{background:var(--brand-wash);color:var(--brand-dark)}
.t-violet{background:var(--violet-wash);color:var(--violet)}

.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--txt-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tb tr:last-child td{border-bottom:none}
table.tb tbody tr:hover{background:#FBFAF9}
table.tb .r{text-align:right;font-variant-numeric:tabular-nums}
table.tb tfoot td{padding:11px 12px;border-top:2px solid var(--line);font-weight:700;background:#FBFAF9}
.empty{padding:40px 20px;text-align:center;color:var(--txt-3);font-size:13.5px}

/* ================= CHỈ SỐ ================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:none;border-radius:var(--r-l);padding:15px 17px;
  box-shadow:var(--sh-card);position:relative;overflow:hidden;transition:box-shadow .3s cubic-bezier(.22,1,.36,1)}
.stat:hover{box-shadow:var(--sh-up)}
.stat .lb{font-size:11.5px;font-weight:500;color:var(--txt-3);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.stat .ic-sq{width:26px;height:26px;border-radius:9px;flex:0 0 26px;background:var(--canvas);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.stat .vl{font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .dt{font-size:11.5px;color:var(--txt-3);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
/* Thẻ nổi bật: khối tối đặc, là điểm neo mắt của cả hàng chỉ số */
.stat.hero{background:linear-gradient(140deg,var(--ink),#242C33);color:#fff;box-shadow:0 2px 4px rgba(20,24,28,.1),0 10px 24px rgba(20,24,28,.18),0 28px 56px rgba(20,24,28,.16)}
.stat.hero:hover{box-shadow:0 4px 8px rgba(20,24,28,.12),0 14px 30px rgba(20,24,28,.22),0 34px 66px rgba(20,24,28,.2)}
.stat.hero .lb{color:#9AA4AD}
.stat.hero .dt{color:#8D97A0}
.stat.hero .ic-sq{background:rgba(255,255,255,.1)}
.up{color:var(--green);font-weight:700}
.dn{color:var(--red);font-weight:700}
.stat.hero .up{color:#3FCB8E}
.stat.hero .dn{color:#F08078}

/* ================= BẢNG P&L =================
   Đọc như báo cáo kế toán: chỉ ba dòng đậm (Doanh thu · Tổng chi phí · Lợi nhuận), nhóm chi
   nhạt hơn, loại chi thụt vào và nhạt nhất. Nền chỉ dùng cho cột Cả năm và dòng Lợi nhuận. */
table.pnl{width:100%;min-width:1080px;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
table.pnl th,table.pnl td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
table.pnl th{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--txt-3);
  background:var(--card);border-bottom:1px solid var(--line)}
table.pnl .lbl{text-align:left;position:sticky;left:0;z-index:1;background:var(--card);min-width:220px;
  box-shadow:inset -1px 0 0 var(--line-soft)}
table.pnl th.lbl{z-index:2}
table.pnl .yr{background:var(--brand-wash);font-weight:700;color:var(--ink)}
table.pnl th.yr{color:var(--brand-dark)}
table.pnl .pc{color:var(--txt-3);font-size:12px;min-width:62px}
table.pnl .dim{color:var(--txt-3);opacity:.45}
table.pnl .pos{color:var(--green)}
table.pnl .neg{color:var(--red)}
table.pnl sup{color:var(--amber);font-weight:700;margin-left:1px}
table.pnl .em{display:inline-block;width:22px}
table.pnl tr.r-head td{font-weight:700;font-size:13.5px;color:var(--ink)}
table.pnl tr.sec td{padding:16px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txt-3);border-bottom:none}
table.pnl tr.r-grp td{font-weight:600;color:var(--txt)}
table.pnl tr.r-grp td.lbl{padding-left:10px}
table.pnl tr.tap{cursor:pointer}
table.pnl tr.tap:hover td{background:#FBFAF9}
table.pnl tr.tap:hover td.yr{background:#F6ECD6}
table.pnl .chev{vertical-align:-2px;margin-right:6px;color:var(--txt-3);transition:transform .2s}
table.pnl .chev.on{transform:rotate(90deg)}
table.pnl .cnt{margin-left:7px;font-size:10.5px;font-weight:700;color:var(--txt-3);background:var(--canvas);
  padding:1px 7px;border-radius:99px}
table.pnl tr.r-item td{color:var(--txt-2);font-size:12.5px;padding-top:7px;padding-bottom:7px}
table.pnl tr.r-item td.lbl{padding-left:32px}
table.pnl tr.r-sum td{font-weight:700;color:var(--ink);border-top:1px solid var(--line);border-bottom:none}
table.pnl tfoot tr.r-profit td{font-weight:800;font-size:14px;background:var(--canvas);border-top:2px solid var(--ink);border-bottom:none}
table.pnl tfoot tr.r-profit td.lbl{background:var(--canvas);color:var(--ink)}
table.pnl tfoot tr.r-profit td.yr{background:var(--brand-wash)}
table.pnl tfoot tr.margin td{font-size:12px;color:var(--txt-3);border-bottom:none;padding-top:6px}

/* ================= PHIẾU LƯƠNG =================
   Cùng một khối .ps dùng cho bản xem trước trong hộp thoại và bản in. Đơn vị mm/pt để
   in ra A4 đúng cỡ; màu chỉ dùng mực đen + một màu thương hiệu, in trắng đen vẫn đọc được. */
.ps-paper{background:var(--canvas);border-radius:14px;padding:18px;overflow-x:auto}
.ps-paper .ps{background:#fff;box-shadow:var(--sh-1);border-radius:6px;margin:0 auto}
.ps{width:100%;max-width:190mm;padding:12mm 12mm 10mm;color:#14181C;font-family:var(--sans);font-size:10.5pt;line-height:1.45}
.ps-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #14181C;padding-bottom:10px;margin-bottom:12px}
.ps-brand{display:flex;gap:10px;align-items:center}
.ps-brand img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.ps-brand b{display:block;font-size:14pt;font-weight:800;letter-spacing:-.01em}
.ps-brand span{display:block;font-size:8.5pt;color:#5A6068;line-height:1.35}
.ps-title{text-align:right}
.ps-title h2{margin:0;font-size:17pt;font-weight:800;letter-spacing:.06em;color:#8C6220}
.ps-title div{font-size:10.5pt;font-weight:600}
.ps-info{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-bottom:12px}
.ps-info .w2{grid-column:1/-1}
.ps-info span{display:block;font-size:8.5pt;color:#8B9199;text-transform:uppercase;letter-spacing:.04em}
.ps-info b{font-weight:600}
.ps-tb{width:100%;border-collapse:collapse;margin-bottom:4px}
.ps-tb td{padding:5px 0;border-bottom:1px dotted #D8D3D0}
.ps-tb td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ps-tb tr.b td{font-weight:700}
.ps-tb tr.note td{font-size:9pt;color:#8B9199;font-style:italic}
.ps-tb tr.net td{font-size:13pt;font-weight:800;border-top:1.5px solid #14181C;border-bottom:1.5px solid #14181C;padding:7px 0;color:#8C6220}
.ps-words{font-size:9.5pt;color:#5A6068;margin-bottom:12px}
.ps-sec{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5A6068;margin:12px 0 6px}
.ps-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ps-cal .hd{font-size:8pt;font-weight:700;color:#8B9199;text-align:center}
.ps-cal .c{border:1px solid #E8E5E3;border-radius:4px;padding:2px 4px;display:flex;justify-content:space-between;align-items:baseline;min-height:22px}
.ps-cal .c small{font-size:7.5pt;color:#8B9199}
.ps-cal .c b{font-size:9.5pt;font-variant-numeric:tabular-nums;color:#C4C8CD}
.ps-cal .c.has b{color:#14181C}
.ps-cal .c.we{background:#FAF3E4}
.ps-list{width:100%;border-collapse:collapse;font-size:9.5pt}
.ps-list td{padding:3px 0;border-bottom:1px dotted #E8E5E3}
.ps-list td:first-child{width:78px;color:#5A6068}
.ps-list td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ps-list tr.b td{font-weight:700;border-bottom:none}
.ps-none{font-size:9.5pt;color:#8B9199}
.ps-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:16px}
.ps-qr{display:flex;gap:10px;align-items:center}
.ps-qr img{width:26mm;height:26mm;border:1px solid #E8E5E3;border-radius:6px}
.ps-qr b{display:block;font-size:9.5pt}
.ps-qr span{display:block;font-size:8.5pt;color:#5A6068}
.ps-sign{display:flex;gap:28px;text-align:center}
.ps-sign b{display:block;font-size:10pt}
.ps-sign span{display:block;font-size:8.5pt;color:#8B9199;font-style:italic;padding-bottom:18mm}
.ps-meta{margin-top:10px;padding-top:6px;border-top:1px solid #E8E5E3;font-size:8pt;color:#8B9199}
.print-root{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff !important}
  body > *:not(.print-root){display:none !important}
  .print-root{display:block}
  .print-root .ps{max-width:none;padding:0}

/* ================= LỊCH THU CHI ================= */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{font-size:11px;font-weight:700;color:var(--txt-3);text-align:center;padding-bottom:2px;letter-spacing:.04em}
.cal-d{min-height:92px;border-radius:12px;background:var(--canvas);padding:7px 8px;text-align:left;
  display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums;transition:box-shadow .18s,background .18s;min-width:0}
.cal-d .n{font-size:12px;font-weight:700;color:var(--txt-2);margin-bottom:3px}
.cal-d .in{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-d .out{font-size:13px;font-weight:700;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-d .c{font-size:10.5px;color:var(--txt-3);margin-top:auto}
.cal-d.has{background:#fff;box-shadow:var(--sh-1);cursor:pointer}
.cal-d.has:hover{box-shadow:var(--sh-up)}
.cal-d.we .n{color:var(--brand-dark)}
.cal-d.today{outline:2px solid var(--brand);outline-offset:-2px}
.cal-d.future{background:none;border:1px dashed var(--line)}
.cal-d.missing{background:repeating-linear-gradient(135deg,var(--canvas) 0 7px,#EFEBE8 7px 9px)}
.cal-d:disabled{cursor:default}
.cal-d i{font-style:normal}
.cal-d .tiny{display:none}
.cal-tot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--line-soft);font-size:13px;color:var(--txt-3);font-variant-numeric:tabular-nums}

/* ================= ĐĂNG NHẬP ================= */
/* Màn đăng nhập lấy chính ảnh khách sạn làm nền: mở app ra là thấy ngay cái mình đang quản lý.
   Ảnh phủ kín, phóng nhẹ cho khỏi thấy mép, rồi phủ một lớp tối chuyển dần lên để thẻ trắng
   ở giữa còn nổi và chữ còn đọc được. */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:#14181C;position:relative;overflow:hidden;isolation:isolate}
.login::before{content:'';position:absolute;inset:-4%;z-index:-2;
  background:url('/hotel.webp') center 38%/cover no-repeat;transform:scale(1.06)}
.login::after{content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(20,24,28,.55),rgba(20,24,28,.72) 55%,rgba(20,24,28,.88))}

  background:var(--amber-wash);margin-bottom:16px;font-size:12.5px;color:#7A5410;line-height:1.55;
  box-shadow:var(--sh-1)}
.banner b{color:#5E4009}

/* =====================================================================
   NHỊP CHUYỂN CẢNH
   ---------------------------------------------------------------------
   1) trang cũ mờ đi (.page.leaving, ~0.22s) rồi mới tháo ra;
   2) hàng chỉ số hiện trước, số chạy từ 0 lên (countUp trong JS);
   3) các thẻ bên dưới bung dần từ trên xuống, cái sau trễ hơn cái trước;
   4) tiêu đề cuộn: chữ cũ trượt xuống mờ đi, chữ mới trượt từ trên xuống vào chỗ (RollSwap).
   fill-mode là `backwards` chứ KHÔNG phải `both`: giữ lại transform/clip-path sau khi chạy xong sẽ
   biến .page/.card thành khung chứa của mọi modal position:fixed bên trong -> modal lệch chỗ.
   Cố ý KHÔNG tắt theo prefers-reduced-motion: máy Windows bật "tiết kiệm pin" là cờ đó bật theo,
   mà hiệu ứng này là thứ chủ app chủ động yêu cầu chứ không phải trang trí thêm.
   ===================================================================== */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes pageOut{to{opacity:0;transform:translateY(-6px)}}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes kpiIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(-14px);clip-path:inset(0 0 100% 0)}
  to{opacity:1;transform:none;clip-path:inset(-80px)}}
.page{animation:pageIn .3s ease-out backwards}
.page.leaving{animation:pageOut .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.page .stat{animation:kpiIn .55s var(--ease) .05s backwards}
.page .card{animation:cardIn .7s var(--ease) .18s backwards}
.page .card:nth-child(2){animation-delay:.26s}
.page .card:nth-child(3){animation-delay:.34s}
.page .card:nth-child(4){animation-delay:.42s}
.page .card:nth-child(5){animation-delay:.50s}
.page .card:nth-child(n+6){animation-delay:.56s}
/* Thẻ lồng trong thẻ và chỉ số trong thẻ không diễn lại lần nữa — bung hai tầng là rối mắt */
.page .card .card,.page .card .stat{animation:none}
.page.leaving .card,.page.leaving .stat{animation:none}

/* Tiêu đề trang cuộn chữ */
.roll{position:relative}
.roll-out{position:absolute;left:0;right:0;top:0;pointer-events:none;
  animation:rollOut .42s cubic-bezier(.4,0,.2,1) forwards}
.roll-in{animation:rollIn .6s var(--ease) .2s backwards}
@keyframes rollOut{to{opacity:0;transform:translateY(80%);filter:blur(2px)}}
@keyframes rollIn{from{opacity:0;transform:translateY(-80%);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}

.mob-bar{display:none}

/* ---- ĐO Ô ĐANG CHỌN ĐỂ VIÊN HIGHLIGHT TRƯỢT TỚI ----
   CSS không tự biết mục nào nằm ở đâu, nên phải đo bằng JS rồi đặt top/height cho viên pill;
   CSS chỉ còn lo phần trượt. Đo lại khi đổi mục, khi menu thu/mở, và khi cửa sổ đổi kích thước. */
function useHlRect(activeKey, boxRef, extraDeps) {
  const [rect, setRect] = useState(null);
  const measure = useCallback(() => {
    const box = boxRef.current;
    const el = box && box.querySelector('[data-hlk="' + activeKey + '"]');
    if (!el) { setRect(null); return; }
    setRect({ top: el.offsetTop, height: el.offsetHeight });
  }, [activeKey, ...(extraDeps || [])]);
  useLayoutEffect(measure, [measure]);
  useEffect(() => {
    const r = requestAnimationFrame(measure);
    window.addEventListener('resize', measure);
    /* Phông chữ về muộn hơn lần vẽ đầu -> mọi thứ xê dịch vài pixel và viên pill nằm trật chỗ
       ngay từ giây đầu mở app. Đo lại một lần nữa khi phông đã sẵn sàng. */
    let live = true;
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (live) measure(); });
    return () => { live = false; cancelAnimationFrame(r); window.removeEventListener('resize', measure); };
  }, [measure]);
  return [rect, measure];
}

/* ---- TIÊU ĐỀ CUỘN CHỮ ----
   Đổi `k` thì giữ lại nội dung cũ thêm một nhịp để nó trượt xuống mờ đi, còn nội dung mới trượt
   từ trên xuống vào chỗ. Nội dung cũ lấy từ lần vẽ trước. */
function RollSwap({ k, children }) {
  const [out, setOut] = useState(null);
  const keyRef = useRef(k);
  const nodeRef = useRef(children);
  useLayoutEffect(() => {
    if (keyRef.current === k) return;
    setOut({ k: keyRef.current, node: nodeRef.current });
    keyRef.current = k;
    const t = setTimeout(() => setOut(null), 750);
    return () => clearTimeout(t);
  }, [k]);
  useEffect(() => { nodeRef.current = children; });
  return (
    <div className="roll">
      {out && <div key={'o' + out.k} className="roll-out" aria-hidden="true">{out.node}</div>}
      <div key={'i' + k} className={out ? 'roll-in' : ''}>{children}</div>
    </div>
  );
}

/* ---- SỐ CHẠY TỪ 0 LÊN ----
   Sửa thẳng text node rồi trả lại nguyên văn khi xong. Giữ nguyên dấu chấm ngăn nghìn / dấu phẩy
   thập phân của chuỗi gốc bằng cách rót chữ số mới vào đúng khuôn chữ số cũ, từ phải sang.
   Nếu React đổi text giữa chừng (người dùng bấm sang tháng khác) thì bỏ node đó, không ghi đè. */
function countUp(root) {
  if (!root) return;
  const els = root.querySelectorAll('.stat .vl');
  const jobs = [];
  els.forEach(el => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = w.nextNode())) {
      const src = n.nodeValue;
      if (src.includes(':')) continue;
      const m = src.match(/\d[\d.,]*\d|\d/);
      if (!m) continue;
      const tok = m[0];
      const target = parseInt(tok.replace(/\D/g, ''), 10);
      if (!target) continue;
      const lastSep = Math.max(tok.lastIndexOf('.'), tok.lastIndexOf(','));
      const tail = lastSep >= 0 ? tok.length - lastSep - 1 : 0;
      const minDigits = lastSep >= 0 && tail !== 3 ? tail + 1 : 1;
      jobs.push({ n, src, tok, at: m.index, target, minDigits, last: src });
    }
  });
  if (!jobs.length) return;
  const fmt = (j, v) => {
    let ds = String(v).padStart(j.minDigits, '0');
    let out = '';
    for (let i = j.tok.length - 1; i >= 0 && ds.length; i--) {
      const c = j.tok[i];
      if (/\d/.test(c)) { out = ds[ds.length - 1] + out; ds = ds.slice(0, -1); }
      else if (ds.length) out = c + out;
    }
    return j.src.slice(0, j.at) + out + j.src.slice(j.at + j.tok.length);
  };
  const DUR = 1000, t0 = performance.now();
  const tick = (now) => {
    const p = Math.min(1, (now - t0) / DUR);
    const e = 1 - Math.pow(1 - p, 4);
    let alive = false;
    jobs.forEach(j => {
      if (j.dead) return;
      if (j.n.nodeValue !== j.last) { j.dead = true; return; }
      j.last = p < 1 ? fmt(j, Math.round(j.target * e)) : j.src;
      j.n.nodeValue = j.last;
      if (p < 1) alive = true;
    });
    if (alive) requestAnimationFrame(tick);
  };
  jobs.forEach(j => { j.last = fmt(j, 0); j.n.nodeValue = j.last; });
  requestAnimationFrame(tick);
}

/* Số giờ một ngày công của từng người — bộ sinh dữ liệu mẫu dùng con số này */
const SEED_SHIFT = { E1: 8, E2: 8, E3: 8, E4: 7, E5: 7, E6: 5, E7: 7 };
const SEED_DAYS = { E1: 26, E2: 26, E3: 26, E4: 26, E5: 26, E6: 26, E7: 0, E8: 0 };

/* Danh sách tháng có dữ liệu: 01/2025 -> tháng hiện tại */
const allMonths = () => {
  const out = [];
  const now = new Date();
  const end = mKey(now.getFullYear(), now.getMonth() + 1);
  let k = '2025-01';
  while (k <= end) { out.push(k); k = mAdd(k, 1); }
  return out;
};

function seedDb() {
  const months = allMonths();
  const emps = SEED_EMP.map(e => ({ ...e }));
  const cash = [];
  const ts = {};

  months.forEach((mk, mi) => {
    const { y, m } = mParse(mk);
    const dim = daysIn(y, m);
    const rng = rngOf(y * 100 + m);

    /* ---- Bảng công ---- */
    const cells = {};
    let gross = 0;
    emps.forEach(e => {
      if (!SEED_DAYS[e.id]) return;
      const want = Math.min(dim, Math.round(SEED_DAYS[e.id] * (0.92 + rng() * 0.16)));
      const row = {};
      let put = 0, d = 1;
      while (put < want && d <= dim) {
        if (d % 7 !== (mi % 7)) { row[d] = SEED_SHIFT[e.id] + (rng() > 0.86 ? 2 : 0); put++; }
        d++;
      }
      cells[e.id] = row;
      gross += Object.values(row).reduce((a, b) => a + b, 0) * e.rate;
    });
    ts[mk] = cells;

    /* ---- Sổ quỹ: phiếu chi ---- */
    const isAug = mk === '2026-08';
    const scale = isAug ? 1 : 0.68 + rng() * 0.7;
    const cats = {};
    Object.keys(AUG26.chi).forEach(c => {
      let v = isAug ? AUG26.chi[c] : Math.round(AUG26.chi[c] * scale * (0.6 + rng() * 0.9) / 1000) * 1000;
      if (c === 'Chi phí sửa chữa KS' && !isAug && rng() > 0.55) v = 0;
      if (c === 'Chi phí hoàn trả tiền phòng khách' && !isAug && rng() > 0.4) v = 0;
      if (v > 0) cats[c] = v;
    });
    Object.keys(cats).forEach(c => {
      /* Cắt mỗi loại thành 1–3 phiếu chi rải trong tháng cho giống sổ quỹ thật */
      const parts = cats[c] > 4000000 ? (rng() > 0.5 ? 3 : 2) : 1;
      let left = cats[c];
      for (let i = 0; i < parts; i++) {
        const amt = i === parts - 1 ? left : Math.round(cats[c] / parts / 1000) * 1000;
        left -= amt;
        if (amt <= 0) continue;
        cash.push({ id: uid(), date: mk + '-' + pad2(Math.min(dim, 3 + Math.floor(rng() * (dim - 4)))), type: 'chi', cat: c, amount: amt, note: c, code: 'PC' + mk.replace('-', '') + pad2(cash.length % 99) });
      }
    });

    /* ---- Tạm ứng lương: vài người ứng giữa tháng ----
       Xoay vòng theo tháng để tháng nào cũng có vài người ứng — bốc hoàn toàn ngẫu nhiên
       thì có tháng không ai ứng, mở đúng tháng đó ra là tưởng tính năng hỏng. */
    emps.filter(e => e.status === 'active').forEach((e, i) => {
      if (i % 3 === mi % 3 || rng() > 0.78) {
        const amt = (1 + Math.floor(rng() * 3)) * 500000;
        cash.push({ id: uid(), date: mk + '-' + pad2(10 + Math.floor(rng() * 8)), type: 'chi', cat: ADVANCE_CAT, amount: amt, note: 'Tạm ứng lương ' + e.name, code: 'TU' + mk.replace('-', ''), empId: e.id });
      }
    });

    /* ---- Sổ quỹ: phiếu thu, dựng ngược từ lợi nhuận mục tiêu ---- */
    const chiTotal = cash.filter(x => x.date.slice(0, 7) === mk && x.type === 'chi' && x.cat !== ADVANCE_CAT)
      .reduce((a, b) => a + b.amount, 0);
    const target = TARGET[mk] != null ? TARGET[mk] : Math.round((chiTotal + gross) * (0.9 + rng() * 0.8));
    const thuTotal = isAug ? AUG26.thu : target + chiTotal + gross;
    /* Rải doanh thu ra từng ngày — trang chi tiết và biểu đồ cần dữ liệu ngày */
    let left = thuTotal;
    for (let d = 1; d <= dim; d++) {
      const last = d === dim;
      const amt = last ? left : Math.round(thuTotal / dim * (0.45 + rng() * 1.2) / 1000) * 1000;
      if (amt <= 0 || (!last && amt > left)) continue;
      left -= amt;
      cash.push({ id: uid(), date: mk + '-' + pad2(d), type: 'thu', cat: 'Doanh thu phòng', amount: amt, note: 'Thu tiền phòng ngày ' + d + '/' + m, code: 'PT' + mk.replace('-', '') + pad2(d) });
    }
  });

  return { cash, employees: emps, timesheet: ts, payroll: {}, closes: {}, cfg: { kvClient: '', kvSecret: '', kvRetailer: '', lastSync: '' } };
}

let FS = null, AUTH = null;

function bootCloud() {
  if (!window.firebase || !firebase.initializeApp) throw new Error('Chưa tải được Firebase SDK — kiểm tra mạng');
  if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
  FS = firebase.firestore();
  /* Firestore mặc định NÉM LỖI nếu payload có field bằng undefined. Trong app này rất dễ dính
     vì nhiều bản ghi dựng bằng { field: điềuKiện ? giáTrị : undefined }. Ném lỗi thì màn hình đã
     đổi rồi mà máy chủ không nhận gì cả — bật cờ này để field undefined chỉ đơn giản là không
     được ghi, chứ không giết cả lệnh ghi. */
  try { FS.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (e) { console.warn('firestore settings:', e.message); }
  AUTH = firebase.auth();
  try { AUTH.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
  return FS;
}

/* ---- ĐỌC TOÀN BỘ DỮ LIỆU MỘT LẦN KHI VÀO APP ----
   Bốn truy vấn chạy song song, tổng cỡ 40–80 document cho hai năm số liệu. Đọc hết một lượt
   rồi giữ trong bộ nhớ thì mọi thao tác sau đó (đổi tháng, đổi trang, tính lại báo cáo) không
   tốn thêm lượt đọc nào — rẻ hơn hẳn so với đọc lại theo từng màn hình. */
async function cloudLoad() {
  const grab = (col) => FS.collection(col).get().catch(e => { console.warn(col, e.message); return { docs: [] }; });
  const [emp, cash, ts, pay, cfg, robot] = await Promise.all([
    grab(COL.emp), grab(COL.cash), grab(COL.ts), grab(COL.pay),
    FS.collection(COL.cfg).doc('main').get().catch(() => null),
    FS.collection(COL.cfg).doc('robot').get().catch(() => null),
  ]);
  const out = { cash: [], employees: [], timesheet: {}, tsNames: {}, payroll: {}, closes: {}, cfg: {} };
  emp.docs.forEach(d => out.employees.push({ ...d.data(), id: d.id }));
  cash.docs.forEach(d => (d.data().rows || []).forEach(r => out.cash.push(r)));
  ts.docs.forEach(d => { const v = d.data(); out.timesheet[d.id] = v.cells || {}; out.tsNames[d.id] = v.names || {}; });
  pay.docs.forEach(d => {
    const v = d.data();
    out.payroll[d.id] = v.rows || {};
    if (v.close) out.closes[d.id] = v.close;
  });
  if (cfg && cfg.exists) out.cfg = cfg.data() || {};
  /* Nhịp tim của robot kéo sổ quỹ (GitHub Actions ghi mỗi lần chạy) — chỉ đọc, app không bao giờ ghi */
  if (robot && robot.exists) out.robot = robot.data() || null;
  /* Nhân viên xếp theo tên cho mọi bảng đều cùng một thứ tự, không phụ thuộc thứ tự Firestore trả về */
  out.employees.sort((a, b) => noAccent(a.name || '').localeCompare(noAccent(b.name || ''), 'vi'));
  return out;
}

/* ---- GHI: GOM LẠI RỒI MỚI GỬI ----
   Bảng chấm công gõ số liên tục, mỗi phím một lần ghi là mỗi phím một lần tính tiền. Gom các
   thay đổi của cùng một document trong 700ms rồi gửi một lần. Rời trang / đóng tab thì đẩy nốt
   phần còn treo, không để mất cái vừa gõ. */
const pending = new Map();
let flushTimer = null;
const queueWrite = (path, data) => {
  if (DEMO) return;
  pending.set(path, data);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flushWrites, 700);
};
function flushWrites() {
  if (!FS || !pending.size) return;
  const batch = FS.batch();
  pending.forEach((data, path) => {
    const [col, id] = path.split('/');
    batch.set(FS.collection(col).doc(id), data, { merge: false });
  });
  pending.clear();
  batch.commit().catch(e => console.error('[CliffHouse] ghi thất bại:', e.message));
}
window.addEventListener('beforeunload', flushWrites);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushWrites(); });

/* Gói lại dữ liệu của MỘT tháng / MỘT nhân viên rồi đẩy vào hàng chờ ghi */
const pushCashMonth = (d, mk) => queueWrite(COL.cash + '/' + mk, { rows: d.cash.filter(x => String(x.date).slice(0, 7) === mk) });
/* Bảng công mang theo luôn TÊN người trong tháng đó. Nhờ vậy kế toán chấm công được mà KHÔNG
   cần quyền đọc hồ sơ nhân viên — nơi cất đơn giá giờ, tức là cất lương. Tên cũ được giữ lại
   khi người ghi không có danh sách nhân viên trong tay. */
const pushTsMonth = (d, mk) => {
  const cells = (d.timesheet || {})[mk] || {};
  const keep = { ...((d.tsNames || {})[mk] || {}) };
  (d.employees || []).forEach(e => { if (cells[e.id]) keep[e.id] = { name: e.name, title: e.title || '' }; });
  queueWrite(COL.ts + '/' + mk, { cells, names: keep });
};
const pushPayMonth = (d, mk) => queueWrite(COL.pay + '/' + mk, { rows: (d.payroll || {})[mk] || {}, close: (d.closes || {})[mk] || null });
const pushCfg = (d) => queueWrite(COL.cfg + '/main', d.cfg || {});
const pushEmp = (e) => { if (!DEMO && FS) FS.collection(COL.emp).doc(e.id).set(e).catch(err => console.error(err.message)); };
const dropEmp = (id) => { if (!DEMO && FS) FS.collection(COL.emp).doc(id).delete().catch(err => console.error(err.message)); };

/* ---- ĐẨY BỘ DỮ LIỆU MẪU LÊN FIRESTORE ----
   Chỉ dùng một lần lúc mới dựng: đăng nhập vào mà màn hình trắng trơn thì không biết app hỏng
   hay chỉ là chưa có số liệu. Có nút này thì nhìn thấy ngay mọi thứ chạy thật trên máy chủ. */
async function seedToCloud(onStep) {
  const d = seedDb();
  /* Liệt kê theo dữ liệu THẬT đang có, không theo mốc cố định — sổ quỹ nạp tới đâu hiện tới đó */
  const months = useMemo(() => {
    const s = new Set((db.cash || []).map(c => String(c.date).slice(0, 7)));
    Object.keys(db.timesheet || {}).forEach(k => s.add(k));
    return Array.from(s).sort();
  }, [db.cash, db.timesheet]);
  let n = 0;
  for (const mk of months) {
    const batch = FS.batch();
    batch.set(FS.collection(COL.cash).doc(mk), { rows: d.cash.filter(x => x.date.slice(0, 7) === mk) });
    const cells = d.timesheet[mk] || {};
    const names = {};
    d.employees.forEach(e => { if (cells[e.id]) names[e.id] = { name: e.name, title: e.title || '' }; });
    batch.set(FS.collection(COL.ts).doc(mk), { cells, names });
    await batch.commit();
    n++; if (onStep) onStep(n, months.length);
  }
  const eb = FS.batch();
  d.employees.forEach(e => eb.set(FS.collection(COL.emp).doc(e.id), e));
  eb.set(FS.collection(COL.cfg).doc('main'), d.cfg);
  await eb.commit();
  return months.length;
}

/* ---- XOÁ SẠCH ---- */
async function wipeCloud() {
  for (const col of [COL.cash, COL.ts, COL.pay, COL.emp]) {
    const snap = await FS.collection(col).get();
    for (let i = 0; i < snap.docs.length; i += 400) {
      const b = FS.batch();
      snap.docs.slice(i, i + 400).forEach(doc => b.delete(doc.ref));
      await b.commit();
    }
  }
}

/* ===================== TÍNH TOÁN ===================== */
/* Phiếu chi lương đã được "nhận" về một tháng công nào đó thì KHÔNG còn là chi phí
   của tháng nó nằm trong sổ quỹ nữa — nếu không sẽ trừ lương hai lần. */
const claimedIds = (db) => {
  const s = new Set();
  Object.values(db.closes || {}).forEach(c => (c.ids || []).forEach(id => s.add(id)));
  return s;
};

const rowsOfMonth = (db, mk) => (db.cash || []).filter(x => String(x.date).slice(0, 7) === mk);

/* Ô "Phép năm" của bảng công: số giờ nghỉ phép năm trong tháng, lưu cùng chỗ với giờ từng ngày
   (key 'pn' thay vì số ngày). Được trả lương như giờ làm thường, nhưng KHÔNG tính là ngày làm việc. */
const PN = 'pn';
/* Phụ cấp tiền ăn chỉ để diễn giải trên bảng lương / phiếu lương — đã nằm sẵn trong lương, không cộng thêm */
const MEAL_PER_DAY = 25000;

/* Tổng giờ được trả lương = giờ các ngày + giờ phép năm */
const hoursOf = (db, mk, empId) => {
  const row = ((db.timesheet || {})[mk] || {})[empId] || {};
  return Object.values(row).reduce((a, b) => a + (Number(b) || 0), 0);
};
const leaveOf = (db, mk, empId) => Number((((db.timesheet || {})[mk] || {})[empId] || {})[PN]) || 0;
/* Số ngày làm việc = số ngày có giờ công (không đếm phép năm) */
const daysOf = (db, mk, empId) => {
  const row = ((db.timesheet || {})[mk] || {})[empId] || {};
  return Object.keys(row).filter(k => k !== PN && Number(row[k]) > 0).length;
};

/* Hai cách tính lương: theo giờ (giờ × đơn giá) hoặc cố định tháng (nhân viên part-time, kế toán thuế...).
   Người lương cố định chỉ tính từ tháng vào làm, và chỉ khi đang làm hoặc tháng đó có công. */
const isFixed = (emp) => emp && emp.payType === 'month';
const paidThisMonth = (db, mk, emp) => {
  if (hoursOf(db, mk, emp.id) > 0) return true;
  if (!isFixed(emp) || emp.status !== 'active') return false;
  return !emp.joined || String(emp.joined).slice(0, 7) <= mk;
};
/* Phần lương CÔNG TY TRẢ của một người (chưa trừ gì): theo công + phụ cấp trách nhiệm + thưởng */
const payBase = (db, mk, emp) => {
  const ov = ((db.payroll || {})[mk] || {})[emp.id] || {};
  const hours = hoursOf(db, mk, emp.id);
  const gross = isFixed(emp) ? n0(emp.salary) : hours * (Number(emp.rate) || 0);
  const resp = n0(emp.respAllow);
  return { ov, hours, gross, resp, base: gross + resp, bonus: n0(ov.bonus) };
};

/* Chi phí lương tạm tính của tháng công mk — dùng cho báo cáo lãi lỗ khi chưa chốt */
const grossOf = (db, mk) => (db.employees || []).reduce((sum, e) => {
  if (!paidThisMonth(db, mk, e)) return sum;
  const p = payBase(db, mk, e);
  return sum + p.base + p.bonus;
}, 0);

/* Tạm ứng app tự tìm được trong sổ quỹ cho một người trong một tháng */
const advanceRows = (db, mk, emp) => {
  const key = noAccent(emp.name).toLowerCase();
  return rowsOfMonth(db, mk)
    .filter(x => x.type === 'chi' && x.cat === ADVANCE_CAT
      && (x.empId === emp.id || noAccent(x.note || '').toLowerCase().includes(key)))
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
};
const autoAdvance = (db, mk, emp) => advanceRows(db, mk, emp).reduce((a, b) => a + b.amount, 0);

/* Bảng lương xếp lương cao xuống thấp. Xếp theo lương công/PC (không theo thực nhận) để các dòng
   không nhảy chỗ trong lúc đang gõ BHXH / tạm ứng. */
const byPay = (a, b) => (b.base + b.bonus) - (a.base + a.bonus) || noAccent(a.emp.name).localeCompare(noAccent(b.emp.name));

/* Một dòng bảng lương.
   BHXH, thuế TNCN, tạm ứng, thưởng: chủ tự điền tay (ch_payroll/<tháng>.rows[id]).
   Tạm ứng KHÔNG tự lấy từ sổ quỹ nữa — số sổ quỹ chỉ hiện làm gợi ý (advanceAuto). */
const payRow = (db, mk, emp) => {
  const p = payBase(db, mk, emp);
  const bhxh = n0(p.ov.bhxh), tncn = n0(p.ov.tncn), advance = n0(p.ov.advance);
  const days = daysOf(db, mk, emp.id);
  return {
    emp, ...p, bhxh, tncn, advance, days,
    leave: leaveOf(db, mk, emp.id),
    meal: days * MEAL_PER_DAY,
    advanceAuto: autoAdvance(db, mk, emp),
    net: p.base - bhxh - tncn - advance + p.bonus,
    paid: !!p.ov.paid,
  };
};

/* Bộ số của một tháng — dùng chung cho cả ba trang báo cáo */
function monthStats(db, mk) {
  const claimed = claimedIds(db);
  const rows = rowsOfMonth(db, mk);
  const thu = rows.filter(x => x.type === 'thu').reduce((a, b) => a + b.amount, 0);
  /* Tạm ứng lương là khoản ứng trước, không phải chi phí — nó đã bị trừ ở bảng lương.
     Cộng vào tổng chi nữa là trừ hai lần. */
  const chiRows = rows.filter(x => x.type === 'chi' && x.cat !== ADVANCE_CAT && !claimed.has(x.id));
  const chi = chiRows.reduce((a, b) => a + b.amount, 0);
  const close = (db.closes || {})[mk] || null;
  const salary = close ? close.amount : grossOf(db, mk);
  const profit = thu - chi - salary;
  /* ---- CẢNH BÁO TRÙNG LƯƠNG ----
     Phiếu chi loại "Chi phí Lương" chưa tháng công nào nhận thì ĐANG bị tính vào tổng chi,
     trong khi lương tạm tính cũng đang bị trừ -> có nguy cơ trừ hai lần.
     Nhưng loại này cũng hay dùng để trả thợ thời vụ / cộng tác viên, số nhỏ, không phải
     lương nhân viên fulltime. Kêu ầm lên mỗi tháng thì người dùng sẽ quen tay bỏ qua, tới
     lúc trùng thật cũng không ai nhìn. Nên chỉ báo khi số tiền đủ lớn so với lương tạm
     tính (từ 50% trở lên) — cỡ đó thì gần như chắc chắn là tiền lương của một tháng công. */
  const salaryVouchers = rows.filter(x => x.type === 'chi' && x.cat === SALARY_CAT && !claimed.has(x.id));
  const vSum = salaryVouchers.reduce((a, b) => a + b.amount, 0);
  const gross0 = grossOf(db, mk);
  const orphan = (gross0 && vSum >= gross0 * 0.5) ? salaryVouchers : [];
  return { mk, thu, chi, chiRows, salary, profit, closed: !!close, close, orphan, empty: rows.length === 0 };
}

/* Chi phí theo loại, xếp đúng thứ tự như báo cáo mẫu (theo chữ sau "Chi phí ") */
const catKey = (nm) => noAccent(String(nm).replace(/^Chi phí\s+/i, '')).toLowerCase();
function catBreak(db, mk) {
  const st = monthStats(db, mk);
  const by = {};
  st.chiRows.forEach(r => { by[r.cat] = (by[r.cat] || 0) + r.amount; });
  return Object.keys(by)
    .sort((a, b) => catKey(a).localeCompare(catKey(b), 'vi'))
    .map(c => ({ cat: c, amount: by[c], pct: st.chi ? by[c] / st.chi * 100 : 0, ...catMeta(c) }));
}

/* Cả năm — dùng cho trang P&L và dòng lũy kế của báo cáo */
function yearStats(db, y) {
  const months = [];
  for (let m = 1; m <= 12; m++) months.push({ ...monthStats(db, mKey(y, m)), m });
  const tot = months.reduce((a, s) => ({
    thu: a.thu + s.thu, chi: a.chi + s.chi, salary: a.salary + s.salary, profit: a.profit + s.profit,
  }), { thu: 0, chi: 0, salary: 0, profit: 0 });
  return { y, months, tot };
}

/* Mọi loại chi từng xuất hiện trong một năm — làm cột cho bảng P&L */
function yearCats(db, y) {
  const set = {};
  for (let m = 1; m <= 12; m++) {
    catBreak(db, mKey(y, m)).forEach(c => { set[c.cat] = (set[c.cat] || 0) + c.amount; });
  }
  return Object.keys(set)
    .sort((a, b) => catKey(a).localeCompare(catKey(b), 'vi'))
    .map(c => ({ cat: c, total: set[c], ...catMeta(c) }));
}

function Modal({ title, sub, wide, onClose, children, foot }) {
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  }, [onClose]);
  return (
    <div className="mask" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={cls('modal', wide && 'wide')}>
        <div className="modal-h">
          <div style={{ minWidth: 0 }}><h3>{title}</h3>{sub && <p>{sub}</p>}</div>
          <button className="x" onClick={onClose} aria-label="Đóng"><Ic.x size={17} /></button>
        </div>
        <div className="modal-b">{children}</div>
        {foot && <div className="modal-f">{foot}</div>}
      </div>
    </div>
  );
}

function Stat({ label, value, sub, icon, tone, hero }) {
  return (
    <div className={cls('stat', hero && 'hero')}>
      <div className="lb">{icon && <span className="ic-sq">{icon}</span>}{label}</div>
      <div className="vl" style={tone ? { color: 'var(--' + tone + ')' } : null}>{value}</div>
      {sub && <div className="dt">{sub}</div>}
    </div>
  );
}

/* Chênh lệch so kỳ trước — im lặng khi không có gì để so */
function Delta({ cur, prev, invert, suffix }) {
  const p = pctDiff(cur, prev);
  if (p == null || !isFinite(p)) return <span style={{ color: 'var(--txt-3)' }}>chưa có kỳ để so</span>;
  const up = p >= 0;
  const good = invert ? !up : up;
  return (
    <span className={good ? 'up' : 'dn'}>
      {up ? <Ic.arrowU size={12} /> : <Ic.arrowD size={12} />}
      {' '}{Math.abs(p).toFixed(1).replace('.', ',')}% {suffix || ''}
    </span>
  );
}

/* Chọn tháng — mũi tên trái phải cho việc lật nhanh, ô chọn cho việc nhảy xa */
function MonthPick({ value, onChange, min, max }) {
  const opts = useMemo(() => {
    const out = [];
    let k = min || '2025-01';
    const end = max || thisMonth();
    while (k <= end) { out.push(k); k = mAdd(k, 1); }
    return out.reverse();
  }, [min, max]);
  const i = opts.indexOf(value);
  return (
    <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
      <button className="btn sm" disabled={i >= opts.length - 1} onClick={() => onChange(opts[i + 1])} aria-label="Tháng trước">‹</button>
      <select className="inp" style={{ width: 'auto', minWidth: 148, fontWeight: 600 }} value={value} onChange={e => onChange(e.target.value)}>
        {opts.map(k => <option key={k} value={k}>{mLabel(k)}</option>)}
      </select>
      <button className="btn sm" disabled={i <= 0} onClick={() => onChange(opts[i - 1])} aria-label="Tháng sau">›</button>
    </div>
  );
}

/* Danh sách thanh ngang — dùng cho bảng chi phí theo loại */
function Bars({ rows, max, onPick }) {
  const top = max || Math.max(1, ...rows.map(r => Math.abs(r.value)));
  if (!rows.length) return <div className="empty">Tháng này chưa có khoản chi nào.</div>;
  return (
    <div>
      {rows.map((r, i) => (
        <div className="bar-row" key={r.key || i} onClick={onPick ? () => onPick(r) : null}
          style={onPick ? { cursor: 'pointer' } : null}>
          <div className="nm" title={r.label}>
            {r.emoji && <b style={{ fontSize: 14 }}>{r.emoji}</b>}
            <span>{r.label}</span>
          </div>
          <div className="bar-track">
            <div className="bar-fill" style={{ width: Math.max(2, Math.abs(r.value) / top * 100) + '%', background: r.color || 'var(--brand)' }} />
          </div>
          <div className="vl">{money(r.value)}</div>
          <div className="pc">{r.pct != null ? r.pct.toFixed(1).replace('.', ',') + '%' : ''}</div>
        </div>
      ))}
    </div>
  );
}

/* Biểu đồ cột 12 tháng — vẽ tay bằng SVG, không cần thư viện ngoài.
   Có cột âm thì trục 0 tự dời xuống đúng chỗ, không vẽ đè ra ngoài khung. */
function Columns({ data, height, fmt, colorOf, onPick, active }) {
  const H = height || 210, PAD = 26;
  const vals = data.map(d => d.value);
  const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
  const span = (hi - lo) || 1;
  const zeroY = PAD + (hi / span) * (H - PAD * 2);
  const n = data.length || 1;
  const bw = 100 / n;
  return (
    <div style={{ overflowX: 'auto' }}>
      <svg viewBox={'0 0 100 ' + H} preserveAspectRatio="none" style={{ width: '100%', height: H, display: 'block', minWidth: n > 8 ? 420 : 0 }}>
        <line x1="0" x2="100" y1={zeroY} y2={zeroY} stroke="var(--line)" strokeWidth="0.3" vectorEffect="non-scaling-stroke" />
        {data.map((d, i) => {
          const h = Math.abs(d.value) / span * (H - PAD * 2);
          const y = d.value >= 0 ? zeroY - h : zeroY;
          const on = active === i;
          return (
            <rect key={i} x={i * bw + bw * 0.22} y={y} width={bw * 0.56} height={Math.max(1.5, h)} rx="1.4"
              fill={colorOf ? colorOf(d, i) : (d.value >= 0 ? 'var(--brand)' : 'var(--red)')}
              opacity={active == null || on ? 1 : 0.42}
              style={onPick ? { cursor: 'pointer' } : null}
              onClick={onPick ? () => onPick(i) : null} />
          );
        })}
      </svg>
      <div style={{ display: 'flex', minWidth: n > 8 ? 420 : 0 }}>
        {data.map((d, i) => (
          <div key={i} style={{ flex: 1, textAlign: 'center', fontSize: 10.5, color: active === i ? 'var(--txt)' : 'var(--txt-3)', fontWeight: active === i ? 700 : 500, padding: '5px 0 0', cursor: onPick ? 'pointer' : null }}
            onClick={onPick ? () => onPick(i) : null}>
            <div>{d.label}</div>
            <div style={{ fontVariantNumeric: 'tabular-nums', fontSize: 10, marginTop: 1 }}>{(fmt || short)(d.value)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* Vòng tròn tỉ trọng — chỉ vẽ tối đa 8 lát, phần còn lại gộp thành "Khác" */
function Donut({ slices, size }) {
  const S = size || 168, R = S / 2 - 12, C = S / 2, CIRC = 2 * Math.PI * R;
  const tot = slices.reduce((a, s) => a + s.value, 0) || 1;
  let acc = 0;
  return (
    <svg width={S} height={S} viewBox={'0 0 ' + S + ' ' + S} style={{ flex: '0 0 auto' }}>
      <circle cx={C} cy={C} r={R} fill="none" stroke="var(--line-soft)" strokeWidth="18" />
      {slices.map((s, i) => {
        const frac = s.value / tot;
        const dash = frac * CIRC;
        const el = (
          <circle key={i} cx={C} cy={C} r={R} fill="none" stroke={s.color} strokeWidth="18"
            strokeDasharray={dash + ' ' + (CIRC - dash)} strokeDashoffset={-acc}
            transform={'rotate(-90 ' + C + ' ' + C + ')'} strokeLinecap="butt" />
        );
        acc += dash;
        return el;
      })}
      <text x={C} y={C - 4} textAnchor="middle" fontSize="11" fill="var(--txt-3)" fontWeight="600">Tổng chi</text>
      <text x={C} y={C + 14} textAnchor="middle" fontSize="14" fill="var(--txt)" fontWeight="800" style={{ fontVariantNumeric: 'tabular-nums' }}>{short(tot)}</text>
    </svg>
  );
}

/* Dựng đúng khuôn báo cáo đang dùng, số lấy thẳng từ dữ liệu nên không bao giờ lệch */
function buildReport(db, mk) {
  const { y, m } = mParse(mk);
  const st = monthStats(db, mk);
  const cats = catBreak(db, mk);
  const ys = yearStats(db, y);
  const L = [];
  L.push('📌 BÁO CÁO TỔNG HỢP');
  L.push('📅 ' + pad2(daysIn(y, m)) + '/' + pad2(m) + '/' + y);
  L.push('📍 Tháng ' + m + ' – Năm ' + y);
  L.push('━━━━━━━━━━');
  L.push('📘 TỔNG QUAN');
  L.push('💰 TỔNG THU: ' + moneyD(st.thu));
  L.push('💸 TỔNG CHI: ' + moneyD(st.chi));
  L.push('📊 CHI PHÍ LƯƠNG ' + (st.closed ? 'ĐÃ CHỐT' : 'TẠM TÍNH') + ': ' + moneyD(st.salary));
  L.push((st.profit >= 0 ? '👍' : '👎') + ' LỢI NHUẬN: ' + moneyD(st.profit));
  L.push('━━━━━━━━━━');
  L.push('📋 CHI TIẾT CHI PHÍ TRONG THÁNG');
  L.push('💸 TỔNG CHI: ' + moneyD(st.chi));
  cats.forEach(c => L.push(c.e + ' ' + c.cat + ': ' + moneyD(c.amount)));
  L.push('━━━━━━━━━━');
  L.push('📊 LŨY KẾ LỢI NHUẬN ' + y);
  let acc = 0;
  ys.months.forEach(s => {
    if (s.m > m) return;
    if (s.empty) return;
    acc += s.profit;
    L.push('🎯 Tháng ' + s.m + ': ' + moneyD(s.profit));
  });
  L.push('👉 Lũy kế: ' + moneyD(acc));
  return L.join('\n');
}

/* ===================== TRANG 2 — CHI TIẾT CHI PHÍ ===================== */
function ExpensePage() {
  const { db } = useApp();
  const [mk, setMk] = useState(() => {
    let k = thisMonth();
    for (let i = 0; i < 24; i++) { if (rowsOfMonth(db, k).length) return k; k = mAdd(k, -1); }
    return thisMonth();
  });
  const [pick, setPick] = useState(null);
  const st = useMemo(() => monthStats(db, mk), [db, mk]);
  const prev = useMemo(() => monthStats(db, mAdd(mk, -1)), [db, mk]);
  const cats = useMemo(() => catBreak(db, mk), [db, mk]);
  const prevCats = useMemo(() => catBreak(db, mAdd(mk, -1)), [db, mk]);
  const prevOf = (c) => (prevCats.find(x => x.cat === c) || {}).amount || 0;
  const { y } = mParse(mk);

  /* Gom theo nhóm lớn để nhìn ra bức tranh, không chìm trong mười mấy dòng lặt vặt */
  const groups = useMemo(() => {
    const by = {};
    cats.forEach(c => { by[c.g] = (by[c.g] || 0) + c.amount; });
    return Object.keys(by).sort((a, b) => by[b] - by[a]).map(g => ({
      g, amount: by[g], pct: st.chi ? by[g] / st.chi * 100 : 0,
      color: (cats.find(c => c.g === g) || {}).c || 'var(--brand)',
    }));
  }, [cats, st.chi]);

  /* Đường đi 12 tháng của loại chi đang chọn */
  const trend = useMemo(() => {
    if (!pick) return null;
    const out = [];
    for (let m = 1; m <= 12; m++) {
      const k = mKey(y, m);
      const v = catBreak(db, k).find(c => c.cat === pick.cat);
      out.push({ label: 'T' + m, value: v ? v.amount : 0 });
    }
    return out;
  }, [pick, db, y]);

  const vouchers = useMemo(() => {
    if (!pick) return [];
    return st.chiRows.filter(r => r.cat === pick.cat).sort((a, b) => a.date.localeCompare(b.date));
  }, [pick, st.chiRows]);

  const biggest = cats.length ? cats.reduce((a, b) => (b.amount > a.amount ? b : a)) : null;
  const jumps = cats.map(c => ({ ...c, prev: prevOf(c.cat), d: pctDiff(c.amount, prevOf(c.cat)) }))
    .filter(c => c.d != null && isFinite(c.d) && Math.abs(c.d) >= 25 && c.amount >= 500000)
    .sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 4);

  return (
    <div>
      <div className="card">
        <div className="card-h">
          <div><h3>Kỳ xem</h3><p>Bấm vào một loại chi để xem từng phiếu và đường đi cả năm</p></div>
          <div className="sp"><MonthPick value={mk} onChange={setMk} /></div>
        </div>
      </div>

      <div className="stats">
        <Stat label="Tổng chi trong tháng" value={money(st.chi)} icon={<span>💸</span>} tone="red"
          sub={<><Delta cur={st.chi} prev={prev.chi} invert /> so tháng trước</>} />
        <Stat label="Số loại chi" value={cats.length} icon={<span>📋</span>}
          sub={st.chiRows.length + ' phiếu chi'} />
        <Stat label="Khoản lớn nhất" value={biggest ? short(biggest.amount) : '—'} icon={<span>{biggest ? biggest.e : '—'}</span>}
          sub={biggest ? biggest.cat.replace(/^Chi phí\s+/, '') + ' · ' + biggest.pct.toFixed(0) + '% tổng chi' : ''} />
        <Stat label="Chi / Thu" value={(st.thu ? st.chi / st.thu * 100 : 0).toFixed(1).replace('.', ',') + '%'} icon={<span>⚖️</span>}
          sub={'Thu ' + short(st.thu) + ' · chi ' + short(st.chi)} />
      </div>

      {!!jumps.length && (
        <div className="card">
          <div className="card-h"><div><h3>Biến động đáng để ý</h3><p>Loại chi tăng/giảm trên 25% so với {mLabel(mAdd(mk, -1)).toLowerCase()}</p></div></div>
          <div className="card-b" style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            {jumps.map(j => (
              <div key={j.cat} style={{
                border: '1px solid var(--line)', borderRadius: 12, padding: '10px 13px',
                background: j.d > 0 ? 'var(--red-wash)' : 'var(--green-wash)', minWidth: 190, flex: '1 1 190px',
              }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 3 }}>{j.e} {j.cat.replace(/^Chi phí\s+/, '')}</div>
                <div style={{ fontSize: 17, fontWeight: 800, color: j.d > 0 ? 'var(--red)' : 'var(--green)' }} className="mono">
                  {j.d > 0 ? '+' : ''}{j.d.toFixed(0)}%
                </div>
                <div className="hint">{money(j.prev)} → <b>{money(j.amount)}</b></div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.5fr) minmax(0,1fr)', gap: 16, alignItems: 'start' }} className="rp-grid">
        <div className="card" style={{ margin: 0 }}>
          <div className="card-h"><div><h3>Chi phí theo loại</h3><p>Tên loại lấy nguyên từ sổ quỹ KiotViet</p></div></div>
          <div className="card-b">
            <Bars onPick={setPick} rows={cats.map(c => ({
              key: c.cat, label: c.cat.replace(/^Chi phí\s+/, ''), emoji: c.e, value: c.amount, pct: c.pct, color: c.c, cat: c.cat,
            }))} />
          </div>
        </div>
        <div className="card" style={{ margin: 0 }}>
          <div className="card-h"><div><h3>Gom theo nhóm</h3><p>Tiền thật chảy về đâu</p></div></div>
          <div className="card-b bars-tight">
            <Bars rows={groups.map(g => ({ key: g.g, label: g.g, value: g.amount, pct: g.pct, color: g.color }))} />
          </div>
        </div>
      </div>

      {pick && (
        <Modal wide title={pick.emoji + ' ' + pick.cat} sub={mLabel(mk) + ' · ' + moneyD(pick.value) + ' · ' + pick.pct.toFixed(1).replace('.', ',') + '% tổng chi'}
          onClose={() => setPick(null)} foot={<button className="btn" onClick={() => setPick(null)}>Đóng</button>}>
          <div className="eyebrow" style={{ marginBottom: 8 }}>Cả năm {y}</div>
          <Columns data={trend} height={150} active={mParse(mk).m - 1}
            colorOf={(d, i) => i === mParse(mk).m - 1 ? 'var(--ink)' : catMeta(pick.cat).c} />
          <div className="eyebrow" style={{ margin: '20px 0 8px' }}>{vouchers.length} phiếu chi trong tháng</div>
          <div className="scroll-x">
            <table className="tb">
              <thead><tr><th>Ngày</th><th>Số phiếu</th><th>Diễn giải</th><th className="r">Số tiền</th></tr></thead>
              <tbody>
                {vouchers.map(v => (
                  <tr key={v.id}>
                    <td className="mono">{dFull(v.date)}</td>
                    <td className="mono" style={{ color: 'var(--txt-3)', fontSize: 12 }}>{v.code}</td>
                    <td>{v.note}</td>
                    <td className="r"><b>{money(v.amount)}</b></td>
                  </tr>
                ))}
              </tbody>
              <tfoot><tr><td colSpan="3">Tổng</td><td className="r">{money(pick.value)}</td></tr></tfoot>
            </table>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ===================== TRANG 3 — P&L THEO NĂM ===================== */
const capFirst = (t) => String(t).charAt(0).toUpperCase() + String(t).slice(1);
/* Số trong bảng P&L: đơn vị triệu, một số lẻ — mọi cột cùng một kiểu thì mắt so được theo chiều dọc */
const mil = (v) => (n0(v) ? (v / 1e6).toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : '');

/* Một dòng của bảng P&L. kind: head (doanh thu) · grp (nhóm chi, bấm mở) · item (loại chi) · sum · profit */
function PnlRow({ kind, label, icon, vals, total, base, months, open, onToggle, count, marks }) {
  const signed = kind === 'profit';
  const tone = (v) => (signed ? (v >= 0 ? 'pos' : 'neg') : '');
  return (
    <tr className={'r-' + kind + (onToggle ? ' tap' : '')} onClick={onToggle}>
      <td className="lbl">
        {onToggle && <Ic.chev size={13} className={'ic chev' + (open ? ' on' : '')} />}
        {icon && <span className="em">{icon}</span>}
        {label}
        {count > 1 && !open && <span className="cnt">{count}</span>}
      </td>
      {vals.map((v, i) => (
        <td key={i} className={cls(months[i].empty && 'dim', tone(v))} title={v ? moneyD(v) : ''}>
          {months[i].empty && !v ? '' : mil(v)}{marks && marks[i] ? <sup>*</sup> : null}
        </td>
      ))}
      <td className={cls('yr', tone(total))} title={moneyD(total)}>{mil(total) || '0'}</td>
      <td className="pc">{kind !== 'head' && base ? (total / base * 100).toFixed(1).replace('.', ',') + '%' : kind === 'head' ? '100%' : ''}</td>
    </tr>
  );
}

function PnlPage() {
  const { db } = useApp();
  const [y, setY] = useState(() => new Date().getFullYear());
  const years = useMemo(() => {
    const s = new Set();
    (db.cash || []).forEach(c => s.add(+String(c.date).slice(0, 4)));
    const a = Array.from(s).sort((x, z) => z - x);
    return a.length ? a : [new Date().getFullYear()];
  }, [db.cash]);
  const ys = useMemo(() => yearStats(db, y), [db, y]);
  const prevYs = useMemo(() => yearStats(db, y - 1), [db, y]);
  const cats = useMemo(() => yearCats(db, y), [db, y]);
  const live = ys.months.filter(s => !s.empty);

  /* Chi phí gom theo nhóm (Nhân sự, Bán hàng...) — mặc định chỉ hiện tổng nhóm, bấm mới xổ ra.
     Lương theo bảng công đứng chung nhóm Nhân sự với phiếu chi lương/BHXH trong sổ quỹ. */
  const [open, setOpen] = useState({});
  const groups = useMemo(() => {
    const monthCats = ys.months.map(s => catBreak(db, s.mk));
    const by = {};
    const add = (g, item) => { (by[g] = by[g] || []).push(item); };
    cats.forEach(c => add(c.g, {
      key: c.cat, label: capFirst(c.cat.replace(/^Chi phí\s+/, '')), e: c.e, total: c.total,
      vals: monthCats.map(mc => (mc.find(x => x.cat === c.cat) || {}).amount || 0),
    }));
    if (ys.tot.salary) add('Nhân sự', {
      key: '__salary', label: 'Lương theo bảng công', e: '📊', total: ys.tot.salary,
      vals: ys.months.map(s => s.salary), marks: ys.months.map(s => !!s.salary && !s.closed),
    });
    return Object.keys(by).map(g => {
      const items = by[g].sort((a, b) => b.total - a.total);
      return {
        g, items,
        total: items.reduce((a, it) => a + it.total, 0),
        vals: ys.months.map((_, i) => items.reduce((a, it) => a + it.vals[i], 0)),
      };
    }).sort((a, b) => b.total - a.total);
  }, [db, cats, ys]);
  const allOpen = groups.length > 0 && groups.every(g => open[g.g]);

  const best = live.length ? live.reduce((a, b) => (b.profit > a.profit ? b : a)) : null;
  const worst = live.length ? live.reduce((a, b) => (b.profit < a.profit ? b : a)) : null;

  return (
    <div>
      <div className="card">
        <div className="card-h">
          <div><h3>Báo cáo lãi lỗ năm {y}</h3><p>Doanh thu · chi phí từng loại · lợi nhuận, 12 tháng trên một bảng</p></div>
          <div className="sp">
            <select className="inp" style={{ width: 'auto', fontWeight: 600 }} value={y} onChange={e => setY(+e.target.value)}>
              {years.map(v => <option key={v} value={v}>Năm {v}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div className="stats">
        <Stat label={'Doanh thu ' + y} value={money(ys.tot.thu)} icon={<span>💰</span>}
          sub={<><Delta cur={ys.tot.thu} prev={prevYs.tot.thu} /> so năm {y - 1}</>} />
        <Stat label="Tổng chi phí" value={money(ys.tot.chi + ys.tot.salary)} icon={<span>💸</span>} tone="red"
          sub={'Gồm lương ' + short(ys.tot.salary)} />
        <Stat hero label={'Lợi nhuận ' + y} value={money(ys.tot.profit)} icon={<span>{ys.tot.profit >= 0 ? '👍' : '👎'}</span>}
          sub={<>Biên {(ys.tot.thu ? ys.tot.profit / ys.tot.thu * 100 : 0).toFixed(1).replace('.', ',')}% · <Delta cur={ys.tot.profit} prev={prevYs.tot.profit} /></>} />
        <Stat label="Tháng tốt nhất" value={best ? 'T' + best.m : '—'} icon={<span>🏆</span>} tone="green"
          sub={best ? money(best.profit) + ' đ · thấp nhất T' + worst.m + ' (' + short(worst.profit) + ')' : ''} />
      </div>

      <div className="card">
        <div className="card-h"><div><h3>Lợi nhuận theo tháng</h3><p>Cột xám là tháng chưa có dữ liệu</p></div></div>
        <div className="chart-wrap">
          <Columns data={ys.months.map(s => ({ label: 'T' + s.m, value: s.empty ? 0 : s.profit, empty: s.empty }))}
            colorOf={(d) => d.empty ? 'var(--line)' : d.value >= 0 ? 'var(--brand)' : 'var(--red)'} />
        </div>
      </div>

      <div className="card">
        <div className="card-h">
          <div><h3>Bảng P&amp;L chi tiết</h3><p>Đơn vị: triệu đồng · bấm vào từng nhóm để xem các loại chi bên trong</p></div>
          <div className="sp">
            <button className="btn sm" onClick={() => setOpen(allOpen ? {} : Object.fromEntries(groups.map(g => [g.g, true])))}>
              {allOpen ? 'Thu gọn' : 'Mở tất cả'}
            </button>
          </div>
        </div>
        <div className="scroll-x">
          <table className="pnl">
            <thead>
              <tr>
                <th className="lbl">Khoản mục</th>
                {ys.months.map(s => <th key={s.m} className={s.empty ? 'dim' : ''}>T{s.m}</th>)}
                <th className="yr">Cả năm</th>
                <th className="pc">% DT</th>
              </tr>
            </thead>
            <tbody>
              <PnlRow kind="head" label="Doanh thu" vals={ys.months.map(s => s.thu)} total={ys.tot.thu} base={ys.tot.thu} months={ys.months} />

              <tr className="sec"><td className="lbl">Chi phí</td>{ys.months.map(s => <td key={s.m} />)}<td className="yr" /><td className="pc" /></tr>
              {groups.map(g => (
                <React.Fragment key={g.g}>
                  <PnlRow kind="grp" label={g.g} vals={g.vals} total={g.total} base={ys.tot.thu} months={ys.months}
                    open={!!open[g.g]} onToggle={() => setOpen(o => ({ ...o, [g.g]: !o[g.g] }))} count={g.items.length} />
                  {open[g.g] && g.items.map(it => (
                    <PnlRow key={it.key} kind="item" label={it.label} icon={it.e} vals={it.vals} total={it.total}
                      base={ys.tot.thu} months={ys.months} marks={it.marks} />
                  ))}
                </React.Fragment>
              ))}
              <PnlRow kind="sum" label="Tổng chi phí" vals={ys.months.map(s => s.chi + s.salary)} total={ys.tot.chi + ys.tot.salary}
                base={ys.tot.thu} months={ys.months} />
            </tbody>
            <tfoot>
              <PnlRow kind="profit" label="Lợi nhuận" vals={ys.months.map(s => s.profit)} total={ys.tot.profit} base={ys.tot.thu} months={ys.months} />
              <tr className="margin">
                <td className="lbl">Biên lợi nhuận</td>
                {ys.months.map(s => <td key={s.m}>{s.empty || !s.thu ? '' : (s.profit / s.thu * 100).toFixed(0) + '%'}</td>)}
                <td className="yr">{ys.tot.thu ? (ys.tot.profit / ys.tot.thu * 100).toFixed(1).replace('.', ',') + '%' : ''}</td>
                <td className="pc"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div className="card-b" style={{ paddingTop: 10, borderTop: '1px solid var(--line-soft)' }}>
          <div className="hint">
            Dấu <b>*</b> là lương tạm tính theo bảng công (tháng đó chưa bấm “Chốt đã chi lương”). Rê chuột vào một ô để xem số đầy đủ.
          </div>
        </div>
      </div>
    </div>
  );
}

/* Màn hẹp thì bảng 31 cột không dùng được — đổi sang chọn người rồi gõ trên tờ lịch.
   Nghe theo cỡ màn hình thật chứ không đoán qua "là điện thoại hay không": xoay ngang máy
   tính bảng hay thu nhỏ cửa sổ trên máy bàn đều phải đổi theo. */
function useNarrow(px) {
  const q = '(max-width:' + (px || 960) + 'px)';
  const [on, setOn] = useState(() => window.matchMedia(q).matches);
  useEffect(() => {
    const mq = window.matchMedia(q);
    const f = (e) => setOn(e.matches);
    mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener(f);
    return () => (mq.removeEventListener ? mq.removeEventListener('change', f) : mq.removeListener(f));
  }, [q]);
  return on;
}

/* Tờ lịch công của MỘT người trong MỘT tháng.
   Ô trống là ngày nghỉ — không tự điền gì cả, đúng như bảng trên máy tính.
   Gõ xong bấm phím "tiếp" trên bàn phím là nhảy sang ngày sau, khỏi phải chấm tay từng ô. */
function PersonSheet({ emp, mk, locked, seePay, onClose }) {
  const { db, setCell } = useApp();
  const { y, m } = mParse(mk);
  const dim = daysIn(y, m);
  const row = ((db.timesheet || {})[mk] || {})[emp.id] || {};
  const total = Object.values(row).reduce((a, b) => a + (Number(b) || 0), 0);
  /* Tuần bắt đầu từ thứ Hai — lịch Việt Nam, và cuối tuần nằm gọn hai ô cuối cho dễ nhìn */
  const lead = (dowOf(y, m, 1) + 6) % 7;
  const cells = Array.from({ length: lead }, () => null)
    .concat(Array.from({ length: dim }, (_, i) => i + 1));
  const go = (d) => {
    const el = document.querySelector('[data-p="' + d + '"]');
    if (el) { el.focus(); el.select(); }
  };
  return (
    <Modal title={emp.name}
      sub={(emp.title || '') + ' · ' + mLabel(mk).toLowerCase() + ' · ' + hrs(total) + ' giờ'
        + (seePay ? ' · ' + money(payBase(db, mk, emp).base) + ' đ' : '')}
      onClose={onClose}
      foot={<button className="btn pri" onClick={onClose}>Xong</button>}>
      {locked && <div className="banner"><Ic.lock size={16} /><div>Tháng này đã chốt lương nên không sửa được công.</div></div>}
      <div className="ts-cal">
        {['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(d => <div key={d} className="hd">{d}</div>)}
        {cells.map((d, i) => {
          if (d == null) return <div key={'p' + i} className="cel pad" />;
          const v = row[d];
          return (
            <div key={d} className={cls('cel', isWeekend(y, m, d) && 'we', v && 'has')}>
              <small>{d}</small>
              <input data-p={d} inputMode="decimal" enterKeyHint="next" disabled={locked}
                value={v == null ? '' : v} placeholder="–"
                onFocus={e => e.target.select()}
                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); go(d + 1); } }}
                onChange={e => setCell(mk, emp.id, d, e.target.value)} />
            </div>
          );
        })}
      </div>
      <div className="fld" style={{ marginTop: 14, display: 'flex', alignItems: 'center', gap: 10 }}>
        <label style={{ margin: 0, flex: 1 }}>Phép năm trong tháng (giờ) — được trả lương như giờ làm</label>
        <input className="inp num" style={{ width: 90 }} inputMode="decimal" disabled={locked}
          value={row[PN] == null ? '' : row[PN]} placeholder="0"
          onChange={e => setCell(mk, emp.id, PN, e.target.value)} />
      </div>
      <div className="hint" style={{ marginTop: 6 }}>
        Để trống là ngày nghỉ. Gõ xong bấm phím <b>tiếp</b> trên bàn phím để nhảy sang ngày sau.
      </div>
    </Modal>
  );
}

/* Ô nhập tiền trong bảng lương: hiện có dấu chấm ngăn nghìn, gõ thì chỉ nhận chữ số */
function MoneyIn({ value, onChange, disabled }) {
  return (
    <input className="inp num pay-in" inputMode="numeric" disabled={disabled}
      value={value ? money(value) : ''} placeholder="0"
      onFocus={e => e.target.select()}
      onChange={e => onChange(n0(e.target.value.replace(/\D/g, '')))} />
  );
}
