function TimesheetPage() {
  const { db, setCell, user } = useApp();
  const [mk, setMk] = useState(thisMonth);
  const { y, m } = mParse(mk);
  const dim = daysIn(y, m);
  const st = monthStats(db, mk);
  const locked = st.closed;
  /* Chỉ chủ mới thấy tiền. Kế toán nhìn thấy giờ công, không thấy đơn giá và không thấy thành tiền. */
  const seePay = !user || user.role !== 'acct';
  const cells = (db.timesheet || {})[mk] || {};
  /* Có quyền đọc hồ sơ nhân viên thì lấy từ đó; không có (kế toán) thì lấy tên đã lưu kèm
     trong chính bảng công của tháng — bảng vẫn chấm được bình thường.
     Người lương cố định không chấm công theo ngày nên không hiện ở đây (vẫn có trong bảng lương bên dưới). */
  const emps = (db.employees || []).length
    ? (db.employees || []).filter(e => hoursOf(db, mk, e.id) > 0 || (e.status === 'active' && !isFixed(e)))
    : Object.keys(cells).map(id => ({ id, rate: 0, ...(((db.tsNames || {})[mk] || {})[id] || { name: id }) }));
  const days = Array.from({ length: dim }, (_, i) => i + 1);
  const narrow = useNarrow(960);
  const [who, setWho] = useState(null);

  const rowTotal = (e) => Object.values(cells[e.id] || {}).reduce((a, b) => a + (Number(b) || 0), 0);
  const dayTotal = (d) => emps.reduce((a, e) => a + (Number((cells[e.id] || {})[d]) || 0), 0);
  const grandH = emps.reduce((a, e) => a + rowTotal(e), 0);
  const grandMoney = seePay ? grossOf(db, mk) : 0;
  const pnTotal = emps.reduce((a, e) => a + (Number((cells[e.id] || {})[PN]) || 0), 0);

  /* Bảng này gõ số liên tục — mũi tên và Enter phải đi được giữa các ô như Excel,
     không thì phải rời tay ra chuột 800 lần một tháng. */
  const move = (ei, d, de, dd) => {
    const ni = ei + de, nd = d + dd;
    if (ni < 0 || ni >= emps.length || nd < 1 || nd > dim) return;
    const el = document.querySelector('[data-c="' + emps[ni].id + '_' + nd + '"]');
    if (el) { el.focus(); el.select(); }
  };
  const onKey = (ei, d) => (e) => {
    const k = e.key;
    if (k === 'ArrowDown' || k === 'Enter') { e.preventDefault(); move(ei, d, 1, 0); }
    else if (k === 'ArrowUp') { e.preventDefault(); move(ei, d, -1, 0); }
    else if (k === 'ArrowRight' && e.target.selectionStart === e.target.value.length) { e.preventDefault(); move(ei, d, 0, 1); }
    else if (k === 'ArrowLeft' && e.target.selectionStart === 0) { e.preventDefault(); move(ei, d, 0, -1); }
  };

  return (
    <div>
      <div className="card">
        <div className="card-h">
          <div><h3>Bảng công {mLabel(mk).toLowerCase()}</h3>
            <p>{narrow ? 'Bấm vào tên người để chấm công cho người đó' : 'Gõ thẳng số giờ vào ô · Enter hoặc mũi tên để đi tiếp · để trống là ngày nghỉ'}</p></div>
          <div className="sp">
            <MonthPick value={mk} onChange={setMk} />
            {locked && <span className="tag t-green"><Ic.lock size={12} /> Đã chốt — không sửa được</span>}
          </div>
        </div>
      </div>

      <div className="stats">
        <Stat label="Tổng giờ công" value={hrs(grandH)} icon={<Ic.clock size={13} />} sub={emps.length + ' người có công'} />
        {seePay
          ? <Stat label="Lương gộp phải trả" value={money(grandMoney)} icon={<span>📊</span>} tone="violet"
            sub="Đây chính là dòng 'chi phí lương' trong báo cáo" />
          : <Stat label="Số người có công" value={emps.length} icon={<span>👥</span>}
            sub="Đơn giá và thành tiền chỉ chủ xem được" />}
        <Stat label="Giờ công bình quân" value={emps.length ? hrs(grandH / emps.length) : '0'} icon={<span>👤</span>} sub="mỗi người / tháng" />
        <Stat label="Ngày đông nhất" value={(() => { let b = 1; days.forEach(d => { if (dayTotal(d) > dayTotal(b)) b = d; }); return dayTotal(b) ? d0(b) + '/' + m : '—'; })()}
          icon={<span>📆</span>} sub={(() => { let b = 1; days.forEach(d => { if (dayTotal(d) > dayTotal(b)) b = d; }); return dayTotal(b) ? hrs(dayTotal(b)) + ' giờ' : ''; })()} />
      </div>

      <div className="card">
        <div className="card-b" style={{ padding: 12 }}>
          {!emps.length
            ? <div className="empty">Chưa có nhân viên nào đang làm việc. Vào trang Nhân viên thêm người trước.</div>
            : narrow ? (
              /* Màn hẹp: danh sách người, bấm vào ai thì mở tờ lịch công của người đó */
              <div>
                {emps.map(e => {
                  const h = rowTotal(e);
                  return (
                    <button key={e.id} className="ts-person" onClick={() => setWho(e)}>
                      <div className="av">{initials(e.name)}</div>
                      <div className="nm">
                        <b>{e.name}</b>
                        <small>{e.title}{seePay && e.rate && !isFixed(e) ? ' · ' + money(e.rate) + 'đ/giờ' : ''}{seePay && isFixed(e) ? ' · lương cố định' : ''}</small>
                      </div>
                      <div className="hh">
                        <b style={{ color: h ? 'var(--txt)' : 'var(--txt-3)' }}>{hrs(h)}</b>
                        <small>{h ? 'giờ' + (seePay ? ' · ' + short(payBase(db, mk, e).base) : '') : 'chưa chấm'}</small>
                      </div>
                      <Ic.chev size={17} style={{ color: 'var(--txt-3)' }} />
                    </button>
                  );
                })}
                <div style={{
                  display: 'flex', justifyContent: 'space-between', padding: '14px 14px 2px',
                  fontSize: 13.5, fontWeight: 700,
                }}>
                  <span>Tổng cả tháng</span>
                  <span className="mono">{hrs(grandH)} giờ{seePay ? ' · ' + money(grandMoney) + ' đ' : ''}</span>
                </div>
              </div>
            ) : (
              <div className="ts-wrap">
                <table className="ts">
                  <thead>
                    <tr>
                      <th className="fix">Nhân viên</th>
                      {days.map(d => (
                        <th key={d} className={isWeekend(y, m, d) ? 'we' : ''} title={['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][dowOf(y, m, d)]}>
                          {d}<div style={{ fontSize: 8.5, fontWeight: 600, opacity: .75 }}>{['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][dowOf(y, m, d)]}</div>
                        </th>
                      ))}
                      <th className="pn" title="Giờ nghỉ phép năm trong tháng — trả lương như giờ làm">Phép<br />năm</th>
                      <th className="tot">Tổng giờ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {emps.map((e, ei) => (
                      <tr key={e.id}>
                        <td className="fix">
                          <b>{e.name}</b>
                          <small>{e.title}{seePay && e.rate ? ' · ' + money(e.rate) + 'đ/giờ' : ''}{e.status === 'off' ? ' · đã nghỉ' : ''}</small>
                        </td>
                        {days.map(d => {
                          const v = (cells[e.id] || {})[d];
                          return (
                            <td key={d} className={cls('cell', isWeekend(y, m, d) && 'we', v && 'has')}>
                              <input data-c={e.id + '_' + d} inputMode="decimal" disabled={locked}
                                value={v == null ? '' : v}
                                onKeyDown={onKey(ei, d)}
                                onFocus={ev => ev.target.select()}
                                onChange={ev => setCell(mk, e.id, d, ev.target.value)} />
                            </td>
                          );
                        })}
                        <td className={cls('cell pn', (cells[e.id] || {})[PN] && 'has')}>
                          <input data-c={e.id + '_' + PN} inputMode="decimal" disabled={locked}
                            value={(cells[e.id] || {})[PN] == null ? '' : (cells[e.id] || {})[PN]}
                            onFocus={ev => ev.target.select()}
                            onChange={ev => setCell(mk, e.id, PN, ev.target.value)} />
                        </td>
                        <td className="tot">
                          {hrs(rowTotal(e))}
                          {seePay && (e.rate || isFixed(e))
                            ? <div style={{ fontSize: 10.5, fontWeight: 600, color: 'var(--txt-3)' }}>{short(payBase(db, mk, e).base)}</div>

const d0 = (d) => String(d);

/* ===================== TRANG 5 — BẢNG LƯƠNG ===================== */
/* ===================== PHIẾU LƯƠNG (PDF) =====================
   Phiếu dựng bằng HTML (chữ tiếng Việt do trình duyệt vẽ, không lỗi dấu), rồi html2canvas + jsPDF
   chụp lại thành file PDF A4 tải thẳng về máy. Xuất tất cả thì gom mọi file vào một .zip. */
const VN_DIGIT = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
/* Đọc một nhóm 3 chữ số. full = nhóm này đứng sau nhóm khác nên phải đọc đủ "không trăm", "lẻ" */
function vnTriple(n, full) {
  const h = Math.floor(n / 100), t = Math.floor(n / 10) % 10, u = n % 10, out = [];
  if (h || full) out.push(VN_DIGIT[h], 'trăm');
  if (t > 1) out.push(VN_DIGIT[t], 'mươi');
  else if (t === 1) out.push('mười');
  else if (u && (h || full)) out.push('lẻ');
  if (u === 1 && t > 1) out.push('mốt');
  else if (u === 5 && t > 0) out.push('lăm');
  else if (u === 4 && t > 1) out.push('tư');
  else if (u) out.push(VN_DIGIT[u]);
  return out.join(' ');
}
function vnWords(v) {
  let n = Math.abs(n0(v));
  if (!n) return 'Không đồng';
  const units = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'];
  const groups = [];
  while (n > 0) { groups.push(n % 1000); n = Math.floor(n / 1000); }
  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    if (!groups[i]) continue;
    parts.push(vnTriple(groups[i], i < groups.length - 1) + (units[i] ? ' ' + units[i] : ''));
  }
  const s = (v < 0 ? 'âm ' : '') + parts.join(' ') + ' đồng';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- Mã QR VietQR tự sinh ----------
   Ảnh QR trên màn hình lấy từ img.vietqr.io, nhưng khi dựng file PDF trình duyệt không được đọc
   ảnh của trang khác (chặn CORS) → ô QR trong PDF sẽ trống. Nên phiếu PDF tự sinh mã theo chuẩn
   EMVCo/NAPAS VietQR — cùng nội dung với ảnh img.vietqr.io: ngân hàng, số tài khoản, số tiền,
   nội dung chuyển khoản. */
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
function vietQrPayload(emp, amount, content) {
  const acc = tlv('00', 'A000000727') + tlv('01', tlv('00', emp.bin) + tlv('01', emp.accNo)) + tlv('02', 'QRIBFTTA');
  const amt = Math.max(0, n0(amount));
  const info = noAccent(content).replace(/[^A-Za-z0-9 .]/g, '').slice(0, 50);
  let p = tlv('00', '01') + tlv('01', amt ? '12' : '11') + tlv('38', acc) + tlv('53', '704')
    + (amt ? tlv('54', String(amt)) : '') + tlv('58', 'VN') + (info ? tlv('62', tlv('08', info)) : '') + '6304';
  return p + crc16(p);
}

/* ---------- Thư viện dựng PDF: chỉ tải khi bấm xuất, không bắt mọi người tải kèm ---------- */
const PDF_LIBS = [
  'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
  'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js',
];
const loadPdfLibs = () => Promise.all(PDF_LIBS.map(u => loadScript(u, 'Không tải được thư viện tạo PDF — kiểm tra mạng')));
const qrDataUrl = (text) => {
  const q = window.qrcode(0, 'M');
  q.addData(text); q.make();
  return q.createDataURL(6, 2);
};
const slipFileName = (row, mk) => {
  const { y, m } = mParse(mk);
  return (row.emp.name + ' - Lương tháng ' + m + ' năm ' + y).replace(/[\\/:*?"<>|]/g, '') + '.pdf';
};
const saveBlob = (blob, name) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

/* Dựng phiếu lương thành file PDF A4: vẽ phiếu HTML ra một khung ẩn, chụp bằng html2canvas
   (chữ tiếng Việt do chính trình duyệt vẽ nên không lỗi dấu), rồi đặt ảnh vào trang A4. */
async function slipPdf(db, mk, row) {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-12000px;top:0;width:794px;background:#fff';
  document.body.appendChild(box);
  const root = ReactDOM.createRoot(box);
  try {
    const qr = hasBank(row.emp) && row.net > 0 ? qrDataUrl(vietQrPayload(row.emp, row.net, qrContent(row.emp, mk))) : null;
    ReactDOM.flushSync(() => root.render(<Payslip db={db} mk={mk} row={row} qrSrc={qr} print />));
    await Promise.all(Array.from(box.querySelectorAll('img')).map(im => im.complete ? 0
      : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 4000); })));
    const canvas = await window.html2canvas(box.firstChild, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const pw = 210, ph = 297, mg = 8;
    let w = pw - mg * 2, h = canvas.height * w / canvas.width;
    if (h > ph - mg * 2) { h = ph - mg * 2; w = canvas.width * h / canvas.height; }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (pw - w) / 2, mg, w, h);
    return pdf.output('blob');
  } finally {
    root.unmount(); box.remove();
  }
}

/* Nút PDF trên từng dòng: tải thẳng file, không cần mở xem trước.
   Tải lẻ thì đặt tên KHÔNG DẤU: có trình duyệt bỏ qua tên file có dấu khi tải thẳng và đặt tên
   thành "download". Trong file .zip thì tên có dấu vẫn giữ nguyên. */
async function downloadSlip(db, mk, row) {
  await loadPdfLibs();
  saveBlob(await slipPdf(db, mk, row), noAccent(slipFileName(row, mk)));
}
/* Xuất tất cả: mỗi người một file PDF, gom vào một file .zip tải một lượt */
async function downloadAllSlips(db, mk, rows, onStep) {
  await loadPdfLibs();
  const zip = new window.JSZip();
  for (let i = 0; i < rows.length; i++) {
    if (onStep) onStep(i + 1, rows.length);
    zip.file(slipFileName(rows[i], mk), await slipPdf(db, mk, rows[i]));
  }
  const { y, m } = mParse(mk);
  saveBlob(await zip.generateAsync({ type: 'blob' }), 'Phieu luong thang ' + m + '-' + y + '.zip');
}

/* ---- CHỐT ĐÃ CHI LƯƠNG ----
   Lương tháng 8 thường tới ngày 10/9 mới chi, nên phiếu chi nằm ở sổ quỹ THÁNG 9.
   Chốt là việc nhận phiếu chi đó về đúng tháng công: tháng 8 dùng số thực chi thay cho
   số tạm tính, còn tháng 9 không bị tính khoản đó vào chi phí nữa. */
function CloseModal({ mk, gross, onClose, onDone }) {
  const { db } = useApp();
  const claimed = claimedIds(db);
  const cands = useMemo(() => {
    const out = [];
    for (let i = 0; i <= 2; i++) {
      rowsOfMonth(db, mAdd(mk, i)).forEach(r => {
        if (r.type === 'chi' && r.cat === SALARY_CAT && !claimed.has(r.id)) out.push(r);
      });
    }
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }, [db, mk]);
  /* KHÔNG tự tích sẵn. Loại "Chi phí Lương" trong sổ quỹ hay lẫn tiền thợ thời vụ, tiền
     cộng tác viên — tích sẵn rồi bấm cho nhanh là chốt nhầm một con số bé tí, lợi nhuận
     tháng đó phình lên vô cớ. Không chọn gì thì mặc định giữ nguyên lương tạm tính. */
  const [sel, setSel] = useState([]);
  const [manual, setManual] = useState('');
  const selSum = cands.filter(c => sel.includes(c.id)).reduce((a, b) => a + b.amount, 0);
  const amount = manual !== '' ? n0(manual.replace(/\D/g, '')) : (selSum || gross);
  const tog = (id) => setSel(s => s.includes(id) ? s.filter(x => x !== id) : s.concat(id));

  return (
    <Modal wide title={'Chốt lương ' + mLabel(mk).toLowerCase()}
      sub="Chọn phiếu chi lương thực tế trong sổ quỹ — kể cả khi nó nằm ở tháng sau"
      onClose={onClose}
      foot={<>
        <button className="btn" onClick={onClose}>Huỷ</button>
        <button className="btn pri" onClick={() => onDone(amount, sel)}>
          <Ic.lock size={14} /> Chốt {moneyD(amount)}
        </button>
      </>}>
      <div className="banner" style={{ background: 'var(--blue-wash)', borderColor: '#C9DCF2', color: '#1C4D85' }}>
        <Ic.warn size={16} />
        <div>Lương tạm tính đang là <b>{moneyD(gross)}</b>. Chốt xong, lợi nhuận {mLabel(mk).toLowerCase()} sẽ dùng
          số bên dưới, và những phiếu chi được chọn sẽ <b>không còn tính vào chi phí của tháng chúng nằm trong</b>.</div>
      </div>

      <div className="eyebrow" style={{ margin: '4px 0 8px' }}>Phiếu chi loại “{SALARY_CAT}” chưa gán tháng nào</div>
      {!cands.length
        ? <div className="empty" style={{ padding: 24 }}>
          Không tìm thấy phiếu chi lương nào trong {mLabel(mk).toLowerCase()} và 2 tháng kế tiếp.<br />
          Vẫn chốt được — số lương sẽ lấy đúng bằng lương tạm tính.
        </div>
        : (
          <table className="tb">
            <thead><tr><th style={{ width: 36 }}></th><th>Ngày</th><th>Nằm ở tháng</th><th>Diễn giải</th><th className="r">Số tiền</th></tr></thead>
            <tbody>
              {cands.map(c => (
                <tr key={c.id} onClick={() => tog(c.id)} style={{ cursor: 'pointer' }}>
                  <td><input type="checkbox" readOnly checked={sel.includes(c.id)} style={{ width: 17, height: 17, accentColor: 'var(--brand)' }} /></td>
                  <td className="mono">{dFull(c.date)}</td>
                  <td>{c.date.slice(0, 7) === mk ? <span className="tag t-gray">cùng tháng</span> : <span className="tag t-blue">{mLabel(c.date.slice(0, 7))}</span>}</td>
                  <td>{c.note}</td>
                  <td className="r mono"><b>{money(c.amount)}</b></td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr><td colSpan="4">Đã chọn {sel.length} phiếu</td><td className="r mono">{money(selSum)}</td></tr></tfoot>
          </table>
        )}

      <div className="fld" style={{ marginTop: 16 }}>
        <label>Số lương chốt cho {mLabel(mk).toLowerCase()}</label>
        <input className="inp num" inputMode="numeric" value={money(amount)}
          onChange={e => setManual(e.target.value)} />
        <div className="hint" style={{ marginTop: 5 }}>
          Để nguyên là lấy tổng phiếu đã chọn{!selSum ? ' (hiện chưa chọn phiếu nào nên đang lấy lương tạm tính)' : ''}. Gõ đè nếu muốn con số khác.
        </div>
      </div>
    </Modal>
  );
}

/* =====================================================================
   NẠP SỔ QUỸ TỪ FILE XUẤT CỦA KIOTVIET
   ---------------------------------------------------------------------
   Gói KiotViet Hotel đang dùng không mở API, nhưng màn hình Sổ quỹ xuất được
   Excel/CSV — thế là đủ. Mỗi tháng xuất một lần rồi thả vào đây.

   KHÔNG đoán mò cấu trúc file: app dò tên cột rồi ĐỀ XUẤT cách ghép, người
   dùng nhìn bảng xem trước mà xác nhận. Ghép xong thì nhớ lại, lần sau thả
   file vào là chạy thẳng. KiotViet đổi tên cột cũng chỉ mất công ghép lại
   một lần, không phải sửa code.
===================================================================== */

/* Thư viện đọc .xlsx nặng gần 1MB — chỉ tải khi thật sự mở hộp thoại nạp file,
   không bắt mọi người tải kèm mỗi lần mở app. */
const XLSX_CDN = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
/* Nhớ promise theo địa chỉ: bấm hai lần liền khi thư viện chưa tải xong thì cùng chờ một lần tải */
const _scripts = {};
const loadScript = (src, msg) => _scripts[src] || (_scripts[src] = new Promise((ok, err) => {
  const s = document.createElement('script');
  s.src = src; s.dataset.lazy = src;
  s.onload = () => ok();
  s.onerror = () => { s.remove(); delete _scripts[src]; err(new Error(msg || 'Không tải được thư viện đọc Excel — kiểm tra mạng')); };
  document.head.appendChild(s);
}));

/* ---- ĐỌC CSV ----
   Tự đoán dấu ngăn cột: KiotViet xuất dấu phẩy, nhưng Excel bản tiếng Việt lưu lại
   thành chấm phẩy, mà tiền Việt lại dùng dấu chấm ngăn nghìn — đoán sai một cái là
   lệch hết cột. Đếm thử từng loại ở dòng đầu, cái nào nhiều nhất thì lấy. */
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  /* Dò dấu ngăn cột trên NHIỀU dòng, không chỉ dòng đầu: file xuất của KiotViet có mấy dòng tên
     khách sạn / khoảng thời gian ở trên, những dòng đó không có dấu ngăn nào cả. Dò trúng một
     dòng rác là cả file bị đọc thành đúng một cột. Lấy dấu nào chia được nhiều cột nhất. */
  const probe = text.split('\n').slice(0, 15).filter(l => l.trim());
  const sep = [',', ';', '\t'].map(c => [c, Math.max(0, ...probe.map(l => l.split(c).length))])
    .sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function readSheet(file) {
  if (/\.csv$/i.test(file.name)) return parseCsv(await file.text());
  await loadScript(XLSX_CDN);
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  /* raw:false để ngày tháng về dạng chữ đã định dạng sẵn, khỏi phải giải mã số thứ tự ngày của Excel */
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
}

/* ---- TÌM DÒNG TIÊU ĐỀ ----
   File xuất thường có vài dòng tên công ty / khoảng thời gian ở trên trước khi tới tiêu đề cột. */
const HDR_HINTS = ['ngay', 'thoi gian', 'ma phieu', 'loai', 'gia tri', 'so tien', 'dien giai', 'thu', 'chi', 'ghi chu', 'nguoi'];
function findHeaderRow(rows) {
  let best = 0, bestScore = 0;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const cells = (rows[i] || []).map(c => noAccent(String(c)).toLowerCase().trim());
    const score = HDR_HINTS.filter(h => cells.some(c => c.includes(h))).length
      + cells.filter(Boolean).length * 0.05;
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return bestScore >= 2 ? best : 0;
}

/* ---- ĐỌC SỐ TIỀN KIỂU VIỆT ----
   "1.234.567" là một triệu hai, không phải 1,23. Chấm và phẩy đều có thể là dấu ngăn nghìn
   tuỳ máy xuất file, nên quy tắc: dấu cuối cùng mà theo sau đúng 3 chữ số thì là ngăn nghìn. */
function vnNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim();
  if (!s) return 0;
  const neg = /^\(.*\)$/.test(s) || s.startsWith('-');
  s = s.replace(/[()\-\s₫đd]/gi, '');
  const last = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
  if (last >= 0 && s.length - last - 1 !== 3) {
    s = s.slice(0, last).replace(/[.,]/g, '') + '.' + s.slice(last + 1);
  } else {
    s = s.replace(/[.,]/g, '');
  }
  const n = parseFloat(s.replace(/[^\d.]/g, ''));
  if (!isFinite(n)) return 0;
  return neg ? -n : n;
}

/* ---- ĐỌC NGÀY ----
   Nhận dd/mm/yyyy, yyyy-mm-dd, có hoặc không kèm giờ. Trả về 'YYYY-MM-DD', không đọc được
   thì trả rỗng để dòng đó bị loại và báo cho người dùng biết bao nhiêu dòng bị bỏ. */
function vnDate(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s) return '';
  let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  m = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    let y = +m[3]; if (y < 100) y += 2000;
    return y + '-' + pad2(+m[2]) + '-' + pad2(+m[1]);
  }
  return '';
}

/* ---- ĐOÁN CỘT ----
   Chấm điểm theo từ khoá trong tên cột. Đoán sai cũng không sao: người dùng nhìn bảng
   xem trước rồi sửa lại bằng ô chọn. */
const guessCol = (heads, keys, avoid) => {
  let best = -1, bestScore = 0;
  heads.forEach((h, i) => {
    const t = noAccent(String(h)).toLowerCase();
    if (!t) return;
    if (avoid && avoid.some(a => t.includes(a))) return;
    let sc = 0;
    keys.forEach((k, ki) => { if (t.includes(k)) sc = Math.max(sc, keys.length - ki); });
    if (sc > bestScore) { bestScore = sc; best = i; }
  });
  return best;
};
function guessMap(heads) {
  return {
    date: guessCol(heads, ['ngay', 'thoi gian', 'ngay tao']),
    cat: guessCol(heads, ['loai thu chi', 'loai phieu', 'nhom', 'loai'], ['gia tri', 'so tien']),
    amount: guessCol(heads, ['gia tri', 'so tien', 'so luong tien', 'thanh tien', 'tien']),
    note: guessCol(heads, ['dien giai', 'ghi chu', 'mo ta', 'noi dung']),
    code: guessCol(heads, ['ma phieu', 'ma chung tu', 'ma']),
    /* "Loại thu chi" của KiotViet là tên HẠNG MỤC (Chi phí Điện, Tiền khách trả…), không phải
       cột chỉ chiều thu/chi — mà chữ "thu chi" lại nằm ngay trong tên. Đoán xong phải loại bỏ
       trường hợp nó trùng với cột hạng mục, nếu không thì mọi phiếu đều bị đọc thành "thu". */
    dir: guessCol(heads, ['thu chi', 'loai giao dich', 'chieu']),
    thu: guessCol(heads, ['thu'], ['loai', 'chi']),
    chi: guessCol(heads, ['chi'], ['loai', 'thu', 'ghi chu']),
  };
}
function guessMapSafe(heads) {
  const g = guessMap(heads);
  if (g.dir >= 0 && g.dir === g.cat) g.dir = -1;
  if (g.thu >= 0 && (g.thu === g.cat || g.thu === g.amount)) g.thu = -1;
  if (g.chi >= 0 && (g.chi === g.cat || g.chi === g.amount)) g.chi = -1;
  return g;
}
const guessMode = (g) =>
  (g.thu >= 0 && g.chi >= 0 && g.amount < 0) ? 'twocol'
    : g.dir >= 0 ? 'dir'
      : g.code >= 0 ? 'code'
        : 'sign';

/* ---- DỰNG PHIẾU TỪ DÒNG FILE ---- */
function buildRows(rows, hdrIdx, map, mode) {
  const out = [], bad = [];
  for (let i = hdrIdx + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const pick = (k) => (map[k] >= 0 ? r[map[k]] : '');
    const date = vnDate(pick('date'));
    if (!date) { if ((r.join('') || '').trim()) bad.push(i + 1); continue; }
    let amount = 0, type = 'chi';
    if (mode === 'twocol') {
      const t = vnNum(pick('thu')), c = vnNum(pick('chi'));
      if (t) { amount = Math.abs(t); type = 'thu'; }
      else if (c) { amount = Math.abs(c); type = 'chi'; }
      else continue;
    } else {
      const raw = vnNum(pick('amount'));
      amount = Math.abs(raw);
      if (!amount) continue;
      if (mode === 'sign') type = raw >= 0 ? 'thu' : 'chi';
      else if (mode === 'code') type = /^(tthu|pt|pthu)/i.test(noAccent(String(pick('code')))) ? 'thu' : 'chi';
      else {
        const d = noAccent(String(pick('dir'))).toLowerCase();
        type = d.includes('thu') && !d.includes('chi') ? 'thu' : 'chi';
      }
    }
    const cat = String(pick('cat') || '').trim() || (type === 'thu' ? 'Doanh thu phòng' : 'Chi phí khác');
    out.push({
      id: 'kv_' + date + '_' + i,
      date, type, amount, cat,
      note: String(pick('note') || cat).trim(),
      code: String(pick('code') || '').trim(),
    });
  }
  return { rows: out, bad };
}

/* ===================== HỘP THOẠI NẠP FILE ===================== */
function ImportModal({ onClose }) {
  const { db, importCash, saveCfg, toast } = useApp();
  const saved = (db.cfg || {}).colmap || null;
  const [file, setFile] = useState(null);
  const [raw, setRaw] = useState(null);
  const [hdrIdx, setHdrIdx] = useState(0);
  const [map, setMap] = useState({});
  const [mode, setMode] = useState('dir');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [drag, setDrag] = useState(false);

  const take = async (f) => {
    if (!f) return;
    setErr(''); setFile(f); setRaw(null);
    try {
      const rows = await readSheet(f);
      if (!rows.length) throw new Error('File không có dòng nào');
      const h = findHeaderRow(rows);
      const heads = (rows[h] || []).map(x => String(x));
      const remembered = saved && saved.heads === heads.join('|');
      const g = remembered ? saved.map : guessMapSafe(heads);
      const md = remembered ? saved.mode : guessMode(g);
      setRaw(rows); setHdrIdx(h); setMap(g); setMode(md);
    } catch (e) { setErr(e.message || String(e)); }
  };

  const heads = raw ? (raw[hdrIdx] || []).map(x => String(x)) : [];
  const built = useMemo(() => (raw ? buildRows(raw, hdrIdx, map, mode) : { rows: [], bad: [] }), [raw, hdrIdx, map, mode]);
  /* ---- ĐANG CÓ GÌ, SẮP THÀNH GÌ ----
     Nạp là ĐÈ nguyên tháng, nên thứ nguy hiểm nhất là xuất nhầm khoảng thời gian: file chỉ có
     nửa tháng mà đè lên tháng đã đủ, số tụt một nửa và không ai thấy ngay. Bày thẳng số cũ cạnh
     số mới cho từng tháng — lệch bất thường thì nhìn phát biết, khỏi cần cảnh báo chung chung. */
  const months = useMemo(() => {
    const s = {};
    built.rows.forEach(r => {
      const k = r.date.slice(0, 7);
      if (!s[k]) s[k] = { mk: k, n: 0, thu: 0, chi: 0 };
      s[k].n++; s[k][r.type] += r.amount;
    });
    return Object.keys(s).sort().map(k => {
      const cur = rowsOfMonth(db, k);
      return {
        ...s[k],
        oldN: cur.length,
        oldThu: cur.filter(x => x.type === 'thu').reduce((a, b) => a + b.amount, 0),
        oldChi: cur.filter(x => x.type === 'chi').reduce((a, b) => a + b.amount, 0),
      };
    });
  }, [built, db.cash]);
  /* Tháng đã có số mà file mới ít hơn một nửa -> gần như chắc chắn xuất thiếu ngày */
  const risky = months.filter(m => m.oldN > 0 && m.n < m.oldN * 0.5);
  const sum = (t) => built.rows.filter(r => r.type === t).reduce((a, b) => a + b.amount, 0);
  const ok = built.rows.length > 0 && map.date >= 0;

  const Sel = ({ k, label, hint }) => (
    <div className="fld" style={{ marginBottom: 9 }}>
      <label>{label}</label>
      <select className="inp" value={map[k] == null ? -1 : map[k]}
        onChange={e => setMap(m => ({ ...m, [k]: +e.target.value }))}>
        <option value={-1}>— không có —</option>
        {heads.map((h, i) => <option key={i} value={i}>{h || '(cột ' + (i + 1) + ')'}</option>)}
      </select>
      {hint && <div className="hint" style={{ marginTop: 3 }}>{hint}</div>}
    </div>
  );

  const doImport = async () => {
    /* Tháng nào tụt quá nửa số phiếu thì bắt xác nhận thêm một lần — đây gần như luôn là
       chọn nhầm khoảng thời gian lúc xuất file, và hậu quả (số tháng đó tụt) rất khó phát hiện sau. */
    if (risky.length && !window.confirm(
      'CẢNH BÁO: ' + risky.map(m => mLabel(m.mk)).join(', ')
      + ' đang có nhiều phiếu hơn hẳn so với file này.\n\nCó thể lúc xuất bị chọn thiếu ngày. '
      + 'Nạp vào là số của tháng đó tụt theo.\n\nVẫn nạp?')) return;
    setBusy(true);
    try {
      await importCash(built.rows, months.map(m => m.mk));
      saveCfg({ colmap: { heads: heads.join('|'), map, mode } });
      toast('Đã nạp ' + built.rows.length + ' phiếu của ' + months.length + ' tháng');
      onClose();
    } catch (e) { setErr(e.message || String(e)); setBusy(false); }
  };

  return (
    <Modal wide title="Nạp sổ quỹ từ file KiotViet"
      sub="Xuất Excel từ màn hình Sổ quỹ rồi thả vào đây"
      onClose={onClose}
      foot={<>
        <button className="btn" onClick={onClose}>Huỷ</button>
        <button className="btn pri" disabled={!ok || busy} onClick={doImport}>
          {busy ? 'Đang nạp…' : 'Nạp ' + built.rows.length + ' phiếu'}
        </button>
      </>}>
      {err && <div className="err">{err}</div>}

      {!raw && (
        <label
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); take(e.dataTransfer.files[0]); }}
          style={{
            display: 'block', padding: '46px 20px', textAlign: 'center', borderRadius: 16, cursor: 'pointer',
            background: drag ? 'var(--brand-wash)' : 'var(--canvas)',
            outline: '2px dashed ' + (drag ? 'var(--brand)' : 'var(--line)'), outlineOffset: -6,
          }}>
          <input type="file" accept=".xlsx,.xls,.csv" style={{ display: 'none' }}
            onChange={e => take(e.target.files[0])} />
          <div style={{ fontSize: 32, marginBottom: 8 }}>📄</div>
          <b style={{ fontSize: 14.5 }}>Kéo file vào đây, hoặc bấm để chọn</b>
          <div className="hint" style={{ marginTop: 6 }}>Nhận .xlsx, .xls, .csv</div>
        </label>
      )}

      {raw && (
        <>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
            <b style={{ fontSize: 13.5, flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              📄 {file.name}
            </b>
            <button className="btn sm" onClick={() => { setRaw(null); setFile(null); }}>Chọn file khác</button>
          </div>

          <div className="eyebrow" style={{ marginBottom: 8 }}>Ghép cột</div>
          <div className="grid2">
            <Sel k="date" label="Ngày *" />
            <Sel k="cat" label="Loại thu chi *" hint="Đây là tên hạng mục hiện trong báo cáo" />
          </div>
          <div className="fld" style={{ marginBottom: 9 }}>
            <label>Biết đâu là thu, đâu là chi?</label>
            <select className="inp" value={mode} onChange={e => setMode(e.target.value)}>
              <option value="dir">Có một cột ghi rõ Thu / Chi</option>
              <option value="twocol">Có hai cột riêng: cột Thu và cột Chi</option>
              <option value="sign">Theo dấu số tiền — số âm là chi</option>
              <option value="code">Theo mã phiếu — bắt đầu bằng TTHU/PT là thu</option>
            </select>
          </div>
          <div className="grid2">
            {mode === 'twocol' ? <><Sel k="thu" label="Cột Thu" /><Sel k="chi" label="Cột Chi" /></>
              : <><Sel k="amount" label="Số tiền *" />{mode === 'dir' ? <Sel k="dir" label="Cột Thu/Chi" /> : <Sel k="code" label="Mã phiếu" />}</>}
          </div>
          <div className="grid2">
            <Sel k="note" label="Diễn giải" />
            {mode !== 'code' && <Sel k="code" label="Mã phiếu" />}
          </div>

          <div className="eyebrow" style={{ margin: '18px 0 8px' }}>Xem trước</div>
          {!built.rows.length
            ? <div className="banner"><Ic.warn size={16} /><div>
              Chưa đọc được dòng nào. Kiểm tra lại cột <b>Ngày</b> — có thể dòng tiêu đề bị nhận nhầm.
            </div></div>
            : (
              <>
                <div className="stats" style={{ gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginBottom: 12 }}>
                  <Stat label="Tổng thu" value={money(sum('thu'))} icon={<span>💰</span>} />
                  <Stat label="Tổng chi" value={money(sum('chi'))} icon={<span>💸</span>} tone="red" />
                  <Stat label="Số phiếu" value={built.rows.length} icon={<span>📋</span>}
                    sub={months.map(m => mLabel(m.mk).replace('Tháng ', 'T')).join(', ')} />
                </div>
                {!!built.bad.length && (
                  <div className="banner"><Ic.warn size={16} /><div>
                    <b>{built.bad.length} dòng bị bỏ qua</b> vì không đọc được ngày (dòng {built.bad.slice(0, 6).join(', ')}
                    {built.bad.length > 6 ? '…' : ''}). Thường là dòng tổng cộng ở cuối file — bỏ là đúng.
                  </div></div>
                )}
                <div className="scroll-x" style={{ maxHeight: 240, overflowY: 'auto' }}>
                  <table className="tb">
                    <thead><tr><th>Ngày</th><th>Loại</th><th>Diễn giải</th><th className="r">Thu</th><th className="r">Chi</th></tr></thead>
                    <tbody>
                      {built.rows.slice(0, 40).map((r, i) => (
                        <tr key={i}>
                          <td className="mono">{dFull(r.date)}</td>
                          <td>{r.cat}</td>
                          <td style={{ maxWidth: 220, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.note}</td>
                          <td className="r mono" style={{ color: 'var(--green)' }}>{r.type === 'thu' ? money(r.amount) : ''}</td>
                          <td className="r mono" style={{ color: 'var(--red)' }}>{r.type === 'chi' ? money(r.amount) : ''}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                {built.rows.length > 40 && <div className="hint" style={{ marginTop: 6 }}>…và {built.rows.length - 40} dòng nữa.</div>}
                <div className="eyebrow" style={{ margin: '18px 0 8px' }}>Những tháng sẽ bị thay</div>
                <table className="tb">
                  <thead><tr><th>Tháng</th><th className="r">Phiếu</th><th className="r">Tổng thu</th><th className="r">Tổng chi</th></tr></thead>
                  <tbody>
                    {months.map(m => {
                      const warn = m.oldN > 0 && m.n < m.oldN * 0.5;
                      return (
                        <tr key={m.mk} style={warn ? { background: 'var(--red-wash)' } : null}>
                          <td><b>{mLabel(m.mk)}</b>{warn && <div className="hint" style={{ color: 'var(--red)', fontWeight: 700 }}>ít hơn một nửa số phiếu đang có</div>}</td>
                          <td className="r mono">{m.oldN ? <span style={{ color: 'var(--txt-3)' }}>{m.oldN} → </span> : null}<b>{m.n}</b></td>
                          <td className="r mono">{m.oldN ? <span style={{ color: 'var(--txt-3)' }}>{short(m.oldThu)} → </span> : null}<b>{money(m.thu)}</b></td>
                          <td className="r mono">{m.oldN ? <span style={{ color: 'var(--txt-3)' }}>{short(m.oldChi)} → </span> : null}<b>{money(m.chi)}</b></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                {risky.length > 0 ? (
                  <div className="banner" style={{ marginTop: 14, background: 'var(--red-wash)', borderColor: '#EED9D7', color: '#8A2F29' }}>
                    <Ic.warn size={16} />
                    <div>
                      <b>Khoan đã.</b> {risky.map(m => mLabel(m.mk).toLowerCase()).join(', ')} đang có nhiều phiếu hơn hẳn
                      so với file này. Thường là do <b>chọn nhầm khoảng thời gian lúc xuất</b> — mới được nửa tháng.
                      Nạp vào là số của tháng đó tụt xuống theo. Kiểm lại bên KiotViet trước khi bấm.
                    </div>
                  </div>
                ) : (
                  <div className="banner" style={{ marginTop: 14, background: 'var(--blue-wash)', borderColor: '#C9DCF2', color: '#1C4D85' }}>
                    <Ic.warn size={16} />
                    <div>Nạp xong sẽ <b>thay toàn bộ</b> sổ quỹ của {months.map(m => mLabel(m.mk).toLowerCase()).join(', ')} bằng
                      nội dung file này. Những tháng khác không đụng tới.</div>
                  </div>
                )}
              </>
            )}
        </>
      )}
    </Modal>
  );
}

/* ===================== TRANG 7 — CẤU HÌNH ===================== */
/* Robot kéo sổ quỹ chạy trên GitHub Actions (robot/soquy/) và ghi nhịp tim vào ch_config/robot.
   Thẻ này chỉ đọc nhịp tim đó: lần chạy gần nhất, được hay lỗi, tổng có khớp KiotViet không. */
function RobotCard({ beat }) {
  const ago = agoText;
  /* Robot chạy mỗi giờ 7h–23h: quá 3 tiếng không thấy nhịp tim là có chuyện */
  const stale = beat && beat.at && (Date.now() - new Date(beat.at).getTime()) > 3 * 3600e3;
  const tone = !beat ? 't-gray' : !beat.ok ? 't-red' : (stale || (beat.warn || []).length) ? 't-amber' : 't-green';
  const label = !beat ? 'chưa chạy' : !beat.ok ? 'lỗi' : stale ? 'lâu không chạy' : (beat.warn || []).length ? 'có cảnh báo' : 'bình thường';
  const months = Object.entries((beat && beat.months) || {}).sort();
  return (
    <div className="card">
      <div className="card-h">
        <div><h3>Robot tự nạp sổ quỹ</h3><p>Kéo từ KiotViet mỗi giờ 7h–23h và lúc 0h30 · chạy trên GitHub</p></div>
        <div className="sp"><span className={'tag ' + tone}>{label}</span></div>
      </div>
      <div className="card-b">
        {!beat ? (
          <div className="hint">Robot chưa ghi lần chạy nào. Nó chỉ chạy theo lịch sau khi code đã nằm trên nhánh <b>main</b> và đủ 4 secrets (xem SETUP.md).</div>
        ) : (
          <>
            <div style={{ fontSize: 13.5, lineHeight: 1.8 }}>
              Lần chạy gần nhất: <b>{ago(beat.at)}</b> ({new Date(beat.at).toLocaleString('vi-VN')})
              {beat.ok ? <> · kéo <b>{beat.rows}</b> phiếu từ {dFull(beat.from)} đến {dFull(beat.to)}</> : null}
              {beat.run ? <> · <a href={beat.run} target="_blank" rel="noopener" style={{ color: 'var(--brand-dark)', fontWeight: 600 }}>xem chi tiết</a></> : null}
            </div>
            {beat.error && <div className="err" style={{ marginTop: 10 }}>{beat.error}</div>}
            {months.length > 0 && (
              <table className="tb" style={{ marginTop: 10 }}>
                <thead><tr><th>Tháng</th><th className="r">Phiếu</th><th className="r">Thu</th><th className="r">Chi</th><th>So với KiotViet</th></tr></thead>
                <tbody>
                  {months.map(([mk, m]) => (
                    <tr key={mk}>
                      <td>{mLabel(mk)}</td>
                      <td className="r mono">{m.n}</td>
                      <td className="r mono">{money(m.thu)}</td>
                      <td className="r mono">{money(m.chi)}</td>
                      <td>{m.match ? <span className="tag t-green">khớp</span>
                        : <span className="tag t-amber" title={'KiotViet: thu ' + money(m.kvThu) + ' · chi ' + money(m.kvChi)}>lệch</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
            {(beat.warn || []).map((w, i) => <div key={i} className="banner" style={{ marginTop: 10, marginBottom: 0 }}><Ic.warn size={15} /><div>{w}</div></div>)}
          </>
        )}
      </div>
    </div>
  );
}

/* Ô lịch trên điện thoại chỉ rộng ~48px: số triệu một số lẻ, bỏ chữ "tr" (dưới 1 triệu thì ghi k) */
const tiny = (v) => (v >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',') : Math.round(v / 1e3) + 'k');
/* "25 phút trước" — dùng cho nhịp tim robot */
const agoText = (iso) => {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'vừa xong';
  if (m < 60) return m + ' phút trước';
  if (m < 60 * 24) return Math.round(m / 60) + ' giờ trước';
  return Math.round(m / 1440) + ' ngày trước';
};

/* ---- TRANG DỮ LIỆU ----
   Hai câu hỏi: sổ quỹ đã có tới ngày nào, và từng ngày thu/chi bao nhiêu.
   Số ở đây là số THÔ của sổ quỹ (mọi phiếu, kể cả tạm ứng và phiếu chi lương) — đúng như
   KiotViet, để đối chiếu. Báo cáo lãi lỗ mới là nơi trừ/loại các khoản đó. */
function DataPage() {
  const { db } = useApp();
  const cash = db.cash || [];
  const { first, last } = useMemo(() => {
    let a = '', b = '';
    cash.forEach(r => { const d = String(r.date); if (!a || d < a) a = d; if (!b || d > b) b = d; });
    return { first: a, last: b };
  }, [cash]);
  const [mk, setMk] = useState(() => (last ? last.slice(0, 7) : thisMonth()));
  const [day, setDay] = useState(null);
  const { y, m } = mParse(mk);
  const dim = daysIn(y, m);
  const lead = (dowOf(y, m, 1) + 6) % 7;   /* lịch bắt đầu từ thứ Hai */
  const today = todayKey();

  const byDay = useMemo(() => {
    const o = {};
    rowsOfMonth(db, mk).forEach(r => {
      const x = o[r.date] || (o[r.date] = { thu: 0, chi: 0, n: 0, rows: [] });
      x[r.type === 'thu' ? 'thu' : 'chi'] += r.amount; x.n++; x.rows.push(r);
    });
    return o;
  }, [db, mk]);
  const tot = Object.values(byDay).reduce((a, x) => ({ thu: a.thu + x.thu, chi: a.chi + x.chi, n: a.n + x.n }), { thu: 0, chi: 0, n: 0 });
  const daysWithData = Object.keys(byDay).length;
  const gap = last ? Math.round((new Date(today) - new Date(last)) / 864e5) : null;
  const beat = db.robot;

  /* Các tháng đang có dữ liệu — hiện thành hàng chip để nhảy nhanh */
  const months = useMemo(() => {
    const c = {};
    cash.forEach(r => { const k = String(r.date).slice(0, 7); c[k] = (c[k] || 0) + 1; });
    return Object.keys(c).sort().reverse().map(k => ({ k, n: c[k] }));
  }, [cash]);

  const dayRows = day && byDay[day] ? byDay[day].rows.slice().sort((a, b) => (a.type === b.type ? b.amount - a.amount : a.type === 'thu' ? -1 : 1)) : [];

  return (
    <div>
      <div className="stats">
        <Stat hero label="Sổ quỹ có dữ liệu đến" value={last ? dFull(last) : '—'} icon={<span>📅</span>}
          sub={last ? (gap <= 0 ? 'tới hôm nay' : 'trễ ' + gap + ' ngày so với hôm nay') + ' · từ ' + dFull(first) : 'chưa có phiếu nào'} />
        <Stat label="Robot nạp gần nhất" value={beat && beat.at ? agoText(beat.at) : '—'} icon={<span>🤖</span>}
          tone={!beat ? '' : beat.ok ? 'green' : 'red'}
          sub={!beat ? 'chưa chạy lần nào' : beat.ok ? beat.rows + ' phiếu · đến ' + dFull(beat.to) : 'lỗi: ' + String(beat.error || '').slice(0, 60)} />
        <Stat label={'Thu ' + mLabel(mk).toLowerCase()} value={money(tot.thu)} icon={<span>💰</span>} tone="green" sub={tot.n + ' phiếu · ' + daysWithData + ' ngày có phiếu'} />
        <Stat label={'Chi ' + mLabel(mk).toLowerCase()} value={money(tot.chi)} icon={<span>💸</span>} tone="red" sub="số thô của sổ quỹ" />
      </div>

      <div className="card">
        <div className="card-h">
          <div><h3>Thu chi theo ngày</h3><p>Bấm vào một ngày để xem từng phiếu · ô gạch chéo là ngày chưa có dữ liệu</p></div>
          <div className="sp"><MonthPick value={mk} onChange={(v) => { setMk(v); setDay(null); }} min={first ? first.slice(0, 7) : undefined} /></div>
        </div>
        <div className="card-b">
          <div className="cal">
            {['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(d => <div key={d} className="cal-h">{d}</div>)}
            {Array.from({ length: lead }, (_, i) => <div key={'p' + i} />)}
            {Array.from({ length: dim }, (_, i) => {
              const d = i + 1, key = mk + '-' + pad2(d), x = byDay[key];
              const future = key > today && !x, missing = !x && !future && (!last || key > last);
              return (
                <button key={d} disabled={!x}
                  className={cls('cal-d', x && 'has', future && 'future', missing && 'missing', key === today && 'today', isWeekend(y, m, d) && 'we')}
                  onClick={() => setDay(key)}>
                  <span className="n">{d}</span>
                  {x ? (
                    <>
                      <span className="in">{x.thu ? <><i className="full">+{short(x.thu)}</i><i className="tiny">+{tiny(x.thu)}</i></> : ''}</span>
                      <span className="out">{x.chi ? <><i className="full">−{short(x.chi)}</i><i className="tiny">−{tiny(x.chi)}</i></> : ''}</span>
                      <span className="c">{x.n} phiếu</span>
                    </>
                  ) : <span className="c">{future ? '' : missing ? 'chưa có' : 'không phiếu'}</span>}
                </button>
              );
            })}
          </div>
          <div className="cal-tot">
            <span>Cả tháng:</span>
            <b className="in">+{money(tot.thu)}</b>
            <b className="out">−{money(tot.chi)}</b>
            <span>chênh {money(tot.thu - tot.chi)} đ · {tot.n} phiếu</span>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-h"><div><h3>Các tháng đang có</h3><p>{cash.length} phiếu · bấm để xem lịch tháng đó</p></div></div>
        <div className="card-b" style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
          {months.map(o => (
            <button key={o.k} className={cls('btn sm', o.k === mk && 'pri')} onClick={() => { setMk(o.k); setDay(null); }}>
              {mLabel(o.k)} · {o.n}
            </button>
          ))}
          {!months.length && <div className="hint">Chưa có dữ liệu sổ quỹ.</div>}
        </div>
      </div>

      {day && byDay[day] && (
        <Modal wide title={'Ngày ' + dFull(day)} onClose={() => setDay(null)}
          sub={'Thu ' + moneyD(byDay[day].thu) + ' · Chi ' + moneyD(byDay[day].chi) + ' · ' + byDay[day].n + ' phiếu'}>
          <div className="scroll-x">
            <table className="tb">
              <thead><tr><th>Mã phiếu</th><th>Loại</th><th>Nội dung</th><th className="r">Số tiền</th></tr></thead>
              <tbody>
                {dayRows.map(r => (
                  <tr key={r.id}>
                    <td className="mono" style={{ whiteSpace: 'nowrap' }}>{r.code || '—'}</td>
                    <td><span className={'tag ' + (r.type === 'thu' ? 't-green' : 't-red')}>{r.type === 'thu' ? 'Thu' : 'Chi'}</span> <span className="hint">{r.cat}</span></td>
                    <td>{r.note}</td>
                    <td className="r mono" style={{ color: r.type === 'thu' ? 'var(--green)' : 'var(--red)', fontWeight: 600 }}>
                      {(r.type === 'thu' ? '+' : '−') + money(r.amount)}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* Kế toán / quản lý không thấy tiền lương và lợi nhuận — xem lại quyết định này ở trang Cấu hình
   nếu sau này muốn mở thêm. */
const ROLE_PAGES = {
  owner: PAGES.map(p => p.k),
  /* Trang Nhân viên hiện ĐƠN GIÁ GIỜ nên nó cũng là trang lương — kế toán không vào. */

};

function Nav({ page, go, user, onOut, min, onToggle }) {
  const allow = ROLE_PAGES[user.role] || [];
  const items = PAGES.filter(p => allow.includes(p.k));
  const groups = items.reduce((a, p) => (a.includes(p.g) ? a : a.concat(p.g)), []);
  const scrollRef = useRef(null);
  /* Đo lại cả khi menu thu/mở và khi số mục đổi (vai trò khác nhau thấy số mục khác nhau) */
  const [hl] = useHlRect(page, scrollRef, [min, items.length]);
  return (
    <nav className="nav">
      <div className="nav-brand">
        <Logo />
        <div className="nav-nm"><b>{BRAND.name}</b><small>{BRAND.sub}</small></div>
        {/* Thu gọn cột menu còn dải icon — trang nào có bảng rộng (P&L, chấm công) thì lấy lại
            được 164px bề ngang mà vẫn đi lại được giữa các chức năng */}
        <button className="nav-min-btn" onClick={onToggle}
          title={min ? 'Mở rộng thanh menu' : 'Thu gọn thanh menu'}
          aria-label={min ? 'Mở rộng thanh menu' : 'Thu gọn thanh menu'}>
          <Ic.panel size={17} />
        </button>
      </div>
      <div className="nav-scroll" ref={scrollRef}>
        {hl && <i className="nav-hl" style={{ top: hl.top, height: hl.height }} />}
        {groups.map(g => (
          <div key={g}>
            <div className="nav-group">{g}</div>
            {items.filter(p => p.g === g).map(p => (
              <button key={p.k} data-hlk={p.k} aria-label={p.l}
                className={cls('nav-item', page === p.k && 'on')} onClick={() => go(p.k)}>
                <p.ic /> <span className="nav-lb">{p.l}</span>
              </button>
            ))}
          </div>
        ))}
      </div>
      <div className="nav-foot">
        <div className="nav-user" title={user.name + ' — ' + ROLE_LABEL[user.role]}>
          <div className="av">{initials(user.name)}</div>
          <div className="who" style={{ minWidth: 0 }}><b>{user.name}</b><small>{ROLE_LABEL[user.role]}</small></div>
        </div>
        <button className="nav-out" onClick={onOut} title="Đăng xuất">Đăng xuất</button>
      </div>
    </nav>
  );
}

    e.preventDefault();
    if (busy) return;
    setBusy(true); setErr('');
    try {
      await AUTH.signInWithEmailAndPassword(em.trim(), pw);
      /* Không cần làm gì thêm: onAuthStateChanged bên App bắt được và tự nạp dữ liệu */
    } catch (ex) { setErr(authMsg(ex)); setBusy(false); }
  };
  return (
    <div className="login">
      <div className="login-card">
        <Logo />
        <h2>{BRAND.name}</h2>
        <p>Quản trị khách sạn — báo cáo, chấm công và bảng lương</p>
        {err && <div className="err">{err}</div>}
        {DEMO ? (
          <>
            <div className="banner" style={{ marginBottom: 16 }}>
              <Ic.warn size={16} />
              <div><b>Bản demo.</b> Dữ liệu mẫu nằm trong trình duyệt này, không đụng tới máy chủ.</div>
            </div>
            <button className="btn pri" style={{ width: '100%', justifyContent: 'center', padding: 12, marginBottom: 9 }}
              onClick={() => onDemo({ name: 'Chủ khách sạn', role: 'owner' })}>Vào với quyền Chủ — thấy hết</button>
            <button className="btn" style={{ width: '100%', justifyContent: 'center', padding: 12 }}
              onClick={() => onDemo({ name: 'Kế toán', role: 'acct' })}>Vào với quyền Kế toán — không thấy lương &amp; lợi nhuận</button>
          </>
        ) : (
          <form onSubmit={submit}>
            <div className="fld"><label>Email</label>
              <input className="inp" type="email" value={em} autoComplete="username"
                onChange={e => setEm(e.target.value)} autoFocus required /></div>
            <div className="fld"><label>Mật khẩu</label>
              <input className="inp" type="password" value={pw} autoComplete="current-password"
                onChange={e => setPw(e.target.value)} required /></div>
            <button className="btn pri" disabled={busy}
              style={{ width: '100%', justifyContent: 'center', padding: 12, marginTop: 6 }}>
              {busy ? 'Đang kiểm tra…' : 'Đăng nhập'}
            </button>
            <div className="hint" style={{ marginTop: 14, textAlign: 'center' }}>
              Quên mật khẩu hoặc cần thêm người dùng thì nhờ quản trị cấp trong Firebase Console.
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

/* Màn hình chờ / báo lỗi dùng chung cho lúc khởi động */
function Splash({ title, sub, action }) {
  return (
    <div className="login">
      <div className="login-card" style={{ textAlign: 'center' }}>
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 16 }}><Logo /></div>
        <h2>{title}</h2>
        <p style={{ marginBottom: action ? 18 : 0 }}>{sub}</p>
        {action}
      </div>
    </div>
  );
}

function App() {
  /* 'boot' = đang nối máy chủ · 'login' = chờ đăng nhập · 'denied' = đăng nhập được nhưng chưa
     được cấp quyền vào app · 'ready' = xong · 'fail' = không nối được Firebase */
  const [phase, setPhase] = useState(DEMO ? 'login' : 'boot');
  const [fatal, setFatal] = useState('');
  const [user, setUser] = useState(null);
  const [db, setDb] = useState(DEMO ? loadDb : EMPTY_DB);
  /* `page` là trang vừa bấm (menu đổi ngay), `shown` là trang đang vẽ: đợi trang cũ mờ xong mới đổi */
  const [page, setPage] = useState('report');
  const [shown, setShown] = useState('report');
  const [leaving, setLeaving] = useState(false);
  /* Mở app là menu THU GỌN. Rê chuột vào icon là mục đó dãn ra hiện tên; muốn menu đầy đủ thì bấm nút. */
  const [navMin, setNavMin] = useState(true);
  const [msg, setMsg] = useState('');
  const tRef = useRef(null);

  const toast = useCallback((m) => {
    setMsg(m);
    clearTimeout(tRef.current);
    tRef.current = setTimeout(() => setMsg(''), 2800);
  }, []);

  /* ---- KHỞI ĐỘNG ----
     Nối Firebase, nghe trạng thái đăng nhập. Đăng nhập rồi thì tra hồ sơ trong ch_users để biết
     vai trò — KHÔNG lấy vai trò từ phía máy này, vì cái gì máy này tự quyết thì máy này tự sửa
     được. Không có hồ sơ nghĩa là tài khoản chưa được cấp quyền vào app. */
  useEffect(() => {
    if (DEMO) return;
    try { bootCloud(); }
    catch (e) { setFatal(e.message); setPhase('fail'); return; }
    return AUTH.onAuthStateChanged(async (u) => {
      if (!u) { setUser(null); setDb(EMPTY_DB); setPhase('login'); return; }
      setPhase('boot');
      try {
        const prof = await FS.collection(COL.usr).doc(u.uid).get();
        if (!prof.exists) { setPhase('denied'); return; }
        const p = prof.data() || {};
        setUser({ uid: u.uid, email: u.email, name: p.name || u.email, role: p.role || 'acct' });
        setDb(await cloudLoad());
        setPhase('ready');
      } catch (e) {
        setFatal(e.message || String(e));
        setPhase('fail');
      }
    });
  }, []);

  /* Mọi thay đổi đi qua đây: cập nhật màn hình rồi ghi xuống ngay, không có bước "bấm Lưu".
     `after` lo phần đẩy lên Firestore đúng document vừa đụng tới. */
  const commit = useCallback((fn, after) => setDb(prev => {
    const next = fn(prev);
    if (DEMO) saveDb(next); else if (after) after(next);
    return next;
  }), []);

  const api = useMemo(() => ({
    db, toast, user,
    reload: async () => { if (!DEMO) { setDb(await cloudLoad()); toast('Đã tải lại số liệu từ máy chủ'); } },
    setCell: (mk, empId, day, raw) => commit(d => {
      const v = String(raw).replace(',', '.').replace(/[^\d.]/g, '');
      const ts = { ...(d.timesheet || {}) };
      const mo = { ...(ts[mk] || {}) };
      const row = { ...(mo[empId] || {}) };
      if (v === '' || Number(v) === 0) delete row[day]; else row[day] = Math.min(day === PN ? 744 : 24, Number(v));
      mo[empId] = row; ts[mk] = mo;
      return { ...d, timesheet: ts };
    }, (next) => pushTsMonth(next, mk)),
    setPay: (mk, empId, patch) => commit(d => {
      const pr = { ...(d.payroll || {}) };
      const mo = { ...(pr[mk] || {}) };
      const row = { ...(mo[empId] || {}), ...patch };
      /* advance = null nghĩa là "thôi, lấy lại số app tự tìm trong sổ quỹ" */
      if (patch.advance === null) delete row.advance;
      mo[empId] = row; pr[mk] = mo;
      return { ...d, payroll: pr };
    }, (next) => pushPayMonth(next, mk)),
    saveEmp: (e) => commit(d => {
      const list = (d.employees || []).slice();
      const i = list.findIndex(x => x.id === e.id);
      if (i >= 0) list[i] = e; else list.push(e);
      list.sort((a, b) => noAccent(a.name || '').localeCompare(noAccent(b.name || ''), 'vi'));
      return { ...d, employees: list };
    }, () => pushEmp(e)),
    delEmp: (id) => commit(d => ({ ...d, employees: (d.employees || []).filter(x => x.id !== id) }),
      () => dropEmp(id)),
    closeMonth: (mk, amount, ids) => commit(
      d => ({ ...d, closes: { ...(d.closes || {}), [mk]: { amount: n0(amount), ids: ids || [], at: todayKey() } } }),
      (next) => pushPayMonth(next, mk)),
    openMonth: (mk) => commit(d => { const c = { ...(d.closes || {}) }; delete c[mk]; return { ...d, closes: c }; },
      (next) => pushPayMonth(next, mk)),
    saveCfg: (patch) => commit(d => ({ ...d, cfg: { ...(d.cfg || {}), ...patch } }), (next) => pushCfg(next)),
    /* Nạp sổ quỹ: THAY nguyên sổ của những tháng có trong file, không cộng dồn.
       Nạp lại cùng một tháng là chuyện bình thường (xuất bù, sửa phiếu) — cộng dồn thì
       tháng đó tự nhân đôi doanh thu mà không ai nhìn ra ngay. */
    importCash: async (rows, months) => {
      const set = new Set(months);
      commit(d => ({ ...d, cash: (d.cash || []).filter(x => !set.has(String(x.date).slice(0, 7))).concat(rows) }),
        (next) => months.forEach(mk => pushCashMonth(next, mk)));
      if (!DEMO) flushWrites();
    },
    resetDemo: () => { const fresh = seedDb(); saveDb(fresh); setDb(fresh); },
    seedCloud: async (onStep) => { await seedToCloud(onStep); setDb(await cloudLoad()); },
    wipeCloud: async () => { await wipeCloud(); setDb(await cloudLoad()); },
  }), [db, commit, toast, user]);

  useEffect(() => {
    if (!user) return;
    const allow = ROLE_PAGES[user.role] || [];
    if (!allow.includes(page)) setPage(allow[0] || 'report');
  }, [user, page]);

  /* Nhịp đổi trang: trang cũ mờ đi 0,22s rồi mới tháo ra và lắp trang mới vào */
  useEffect(() => {
    if (page === shown) { setLeaving(false); return; }
    setLeaving(true);
    const t = setTimeout(() => { setShown(page); setLeaving(false); }, 220);
    return () => clearTimeout(t);
  }, [page, shown]);

  /* Cho các con số chạy từ 0 lên, ngay sau khi trang mới vừa được lắp vào */
  useEffect(() => {
    const t = setTimeout(() => countUp(document.querySelector('.page')), 60);
    return () => clearTimeout(t);
  }, [shown, phase]);

  const signOut = () => {
    if (DEMO) { setUser(null); setPhase('login'); return; }
    flushWrites();
    AUTH.signOut();
  };

  if (phase === 'fail') return <Splash title="Không nối được máy chủ" sub={fatal}
    action={<button className="btn pri" onClick={() => location.reload()}>Thử lại</button>} />;
  if (phase === 'boot') return <Splash title={BRAND.name} sub="Đang tải số liệu…" />;
  if (phase === 'denied') return <Splash title="Tài khoản chưa được cấp quyền"
    sub={'Đăng nhập thành công nhưng tài khoản này chưa có hồ sơ trong ' + COL.usr + '. Nhờ quản trị thêm vào rồi đăng nhập lại.'}
    action={<button className="btn" onClick={signOut}>Đăng xuất</button>} />;
  if (!user) return <Login onDemo={(u) => { setUser(u); setPhase('ready'); }} />;

  const allow = ROLE_PAGES[user.role] || [];
  const cur = PAGES.find(p => p.k === shown && allow.includes(p.k)) || PAGES.find(p => allow.includes(p.k));
  const Body = cur ? cur.C : () => <div className="empty">Vai trò này chưa được mở trang nào.</div>;
  const today = new Date();

  return (
    <AppCtx.Provider value={api}>
      <div className={cls('shell', navMin && 'nav-min')}>
        <Nav page={page} go={setPage} user={user} min={navMin} onToggle={() => setNavMin(v => !v)} onOut={signOut} />
        <div className="main">
          <div className="topbar">
            <div style={{ minWidth: 0 }}>
              {/* Tiêu đề cuộn: chữ cũ trượt xuống mờ đi, chữ mới trượt từ trên xuống vào chỗ */}
              <RollSwap k={shown}>
                <h1>{cur ? cur.t[0] : BRAND.name}</h1>
                <div className="sub">{cur ? cur.t[1] : ''}</div>
              </RollSwap>
            </div>
            <div className="top-right">
              {DEMO && <span className="tag t-amber">DEMO — dữ liệu mẫu</span>}
              <span className="top-date">{pad2(today.getDate())}/{pad2(today.getMonth() + 1)}/{today.getFullYear()}</span>
            </div>
          </div>
          {/* key={shown} để React tháo hẳn trang cũ và lắp trang mới — có vậy hiệu ứng mới chạy lại */}
          <div key={shown} className={cls('page', leaving && 'leaving')}><Body /></div>
        </div>
        <div className="mob-bar">
          {PAGES.filter(p => allow.includes(p.k)).map(p => (
            <button key={p.k} className={cls(page === p.k && 'on')} onClick={() => setPage(p.k)}>
              <p.ic size={19} /><span>{p.s}</span>
            </button>
          ))}
        </div>
        <Toast msg={msg} />
      </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
const boot = document.getElementById('boot');
if (boot) boot.remove();
</script>

<script>
/* ---------------------------------------------------------------
   Bộ nạp: dịch JSX bằng Babel ngay trong trình duyệt rồi chạy.
   File này nhỏ nên dịch xong trong khoảng một phần mười giây —
   không cần npm, không cần build, sửa file là F5 thấy liền.
   Dịch hỏng thì in lỗi ra giữa màn hình chứ không để trang trắng.
--------------------------------------------------------------- */
(function () {
  var show = function (title, detail) {
    var b = document.getElementById('boot');
    if (!b) { console.error(title, detail); return; }
    b.innerHTML =
      '<div style="max-width:720px;padding:24px;font-family:system-ui,sans-serif">'
      + '<div style="font-size:15px;font-weight:700;color:#C4443C;margin-bottom:8px">' + title + '</div>'
      + '<pre style="white-space:pre-wrap;font-size:12px;color:#5C6572;line-height:1.6;margin:0">'
      + String(detail).replace(/[<>&]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]; })
      + '</pre></div>';
  };
  if (!window.React || !window.ReactDOM) return show('Không tải được React', 'Máy đang không có mạng, hoặc cdn.jsdelivr.net bị chặn. App cần mạng ở lần tải đầu.');
  if (!window.Babel) return show('Không tải được Babel', 'Máy đang không có mạng, hoặc cdn.jsdelivr.net bị chặn.');
  var src = document.getElementById('src').textContent;
  var code;
  try {
    code = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]], sourceType: 'script' }).code;
  } catch (e) {
    return show('Lỗi cú pháp trong mã nguồn', e.message);
  }
  try {
    (0, eval)(code);
  } catch (e) {
    return show('Lỗi khi chạy app', (e && e.stack) || e);
  }
})();
</script>
